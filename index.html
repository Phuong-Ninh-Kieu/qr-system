<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR NHẬN QUÀ</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f2f5f9;
}

.header{
    background:#b30000;
    color:white;
    text-align:center;
    padding:15px;
    border-bottom:4px solid #ffcc00;
}

.header h1{
    font-size:22px;
}

.container{
    width:95%;
    max-width:1300px;
    margin:auto;
    padding:10px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#b30000;
    margin-bottom:15px;
    font-size:18px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}

.box{
    background:#b30000;
    color:white;
    text-align:center;
    padding:15px;
    border-radius:10px;
}

.box h3{
    font-size:28px;
}

input,button{
    padding:10px;
    border-radius:5px;
    border:1px solid #ccc;
    margin:5px 0;
    width:100%;
}

button{
    background:#b30000;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.actions{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

table th{
    background:#b30000;
    color:white;
    padding:10px;
}

table td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

#reader{
    width:100%;
    max-width:400px;
    margin:auto;
}

.success{
    color:green;
    font-size:22px;
    font-weight:bold;
}

.error{
    color:red;
    font-size:22px;
    font-weight:bold;
}

.popup{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup-content{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    width:90%;
    max-width:350px;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
}

@media(max-width:768px){

    .header h1{
        font-size:18px;
    }

    .box h3{
        font-size:22px;
    }

    table{
        font-size:13px;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>HỆ THỐNG QR NHẬN QUÀ</h1>

    <p>ỦY BAN NHÂN DÂN2</p>

</div>

<div class="container">

    <div class="card">

        <h2>DASHBOARD</h2>

        <div class="dashboard">

            <div class="box">
                <h3 id="tongDS">0</h3>
                <p>Tổng DS</p>
            </div>

            <div class="box">
                <h3 id="daNhan">0</h3>
                <p>Đã nhận</p>
            </div>

            <div class="box">
                <h3 id="chuaNhan">0</h3>
                <p>Chưa nhận</p>
            </div>

            <div class="box">
                <h3 id="tongQuet">0</h3>
                <p>Lượt quét</p>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>IMPORT EXCEL</h2>

        <div class="actions">

            <input type="file" id="excelFile" accept=".xlsx,.xls">

            <button onclick="importExcel()">
                IMPORT EXCEL
            </button>

            <button onclick="exportExcelQR()">
                XUẤT EXCEL QR
            </button>

            <button onclick="deleteAllData()">
                XÓA TOÀN BỘ DATA
            </button>

        </div>

    </div>

    <div class="card">

        <h2>📷 CAMERA QUÉT QR</h2>

        <div id="reader"></div>

        <div id="scanResult" style="margin-top:20px;text-align:center;"></div>

    </div>

    <div class="card">

        <h2>DANH SÁCH</h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>STT</th>
                        <th>HỌ TÊN</th>
                        <th>ĐỊA CHỈ</th>
                        <th>KHU VỰC</th>
                        <th>TRẠNG THÁI</th>
                        <th>QR</th>

                    </tr>

                </thead>

                <tbody id="tableData"></tbody>

            </table>

        </div>

    </div>

</div>

<div class="footer">

QR REALTIME DATABASE SYSTEM

</div>

<script>

// ====================================
// FIREBASE
// ====================================

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId: "YOUR_PROJECT",

    storageBucket: "YOUR_PROJECT.appspot.com",

    messagingSenderId: "XXXX",

    appId: "XXXX"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ====================================
// TOKEN
// ====================================

function randomToken(length=32){

    const chars =
    'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    let result='';

    for(let i=0;i<length;i++){

        result += chars.charAt(
            Math.floor(Math.random()*chars.length)
        );
    }

    return result;
}

// ====================================
// IMPORT EXCEL
// ====================================

async function importExcel(){

    const file =
    document.getElementById('excelFile').files[0];

    if(!file){

        alert("Chọn file Excel");

        return;
    }

    const reader = new FileReader();

    reader.onload = async function(e){

        const data =
        new Uint8Array(e.target.result);

        const workbook =
        XLSX.read(data,{type:'array'});

        const sheet =
        workbook.Sheets[workbook.SheetNames[0]];

        const json =
        XLSX.utils.sheet_to_json(sheet);

        let counter = 0;

        for(let item of json){

            counter++;

            const values =
            Object.values(item);

            const stt = values[0] || '';

            const hoTen = values[1] || '';

            const diaChi = values[2] || '';

            const khuVuc = values[3] || '';

            const id =
            'QR'+Date.now()+counter;

            const token =
            randomToken();

            const qrLink =
            window.location.origin +
            window.location.pathname +
            '?id='+id+
            '&token='+token;

            await db.ref('recipients/'+id).set({

                stt,
                hoTen,
                diaChi,
                khuVuc,
                token,
                qrLink,
                received:false,
                scan:0

            });

        }

        alert("IMPORT THÀNH CÔNG");

        loadData();

    };

    reader.readAsArrayBuffer(file);

}

// ====================================
// LOAD DATA
// ====================================

async function loadData(){

    const snapshot =
    await db.ref('recipients').once('value');

    const tbody =
    document.getElementById('tableData');

    tbody.innerHTML='';

    let total = 0;

    let daNhan = 0;

    let tongQuet = 0;

    if(snapshot.exists()){

        const data = snapshot.val();

        for(let id in data){

            total++;

            tongQuet += data[id].scan || 0;

            if(data[id].received){

                daNhan++;
            }

            tbody.innerHTML += `

            <tr>

                <td>${data[id].stt}</td>

                <td>${data[id].hoTen}</td>

                <td>${data[id].diaChi}</td>

                <td>${data[id].khuVuc}</td>

                <td>

                    ${
                        data[id].received
                        ?
                        '<span style="color:green;font-weight:bold;">ĐÃ NHẬN</span>'
                        :
                        '<span style="color:red;font-weight:bold;">CHƯA NHẬN</span>'
                    }

                </td>

                <td>

                    <button onclick="showQR('${id}')">

                        XEM QR

                    </button>

                </td>

            </tr>

            `;
        }
    }

    document.getElementById('tongDS').innerText =
    total;

    document.getElementById('daNhan').innerText =
    daNhan;

    document.getElementById('chuaNhan').innerText =
    total - daNhan;

    document.getElementById('tongQuet').innerText =
    tongQuet;

}

// ====================================
// SHOW QR
// ====================================

async function showQR(id){

    const snapshot =
    await db.ref('recipients/'+id).once('value');

    if(!snapshot.exists()){

        alert("Không tìm thấy");

        return;
    }

    const data = snapshot.val();

    const oldPopup =
    document.querySelector('.popup');

    if(oldPopup){

        oldPopup.remove();
    }

    const popup =
    document.createElement('div');

    popup.className='popup';

    popup.innerHTML = `

        <div class="popup-content">

            <h3>${data.hoTen}</h3>

            <br>

            <div id="popupQR"></div>

            <br>

            <button onclick="closePopup()">

                ĐÓNG

            </button>

        </div>

    `;

    document.body.appendChild(popup);

    setTimeout(()=>{

        document.getElementById('popupQR').innerHTML='';

        new QRCode(
            document.getElementById('popupQR'),
            {
                text:data.qrLink,
                width:220,
                height:220
            }
        );

    },100);

}

function closePopup(){

    const popup =
    document.querySelector('.popup');

    if(popup){

        popup.remove();
    }

}

// ====================================
// DELETE ALL DATA
// ====================================

async function deleteAllData(){

    let confirmDelete =
    confirm("Xóa toàn bộ dữ liệu?");

    if(!confirmDelete){

        return;
    }

    await db.ref('recipients').remove();

    alert("Đã xóa toàn bộ");

    loadData();

}

// ====================================
// EXPORT EXCEL QR
// ====================================

async function exportExcelQR(){

    const snapshot =
    await db.ref('recipients').once('value');

    if(!snapshot.exists()){

        alert("Không có dữ liệu");

        return;
    }

    const data = snapshot.val();

    let rows = [];

    for(let id in data){

        rows.push({

            STT:data[id].stt,

            HOTEN:data[id].hoTen,

            DIACHI:data[id].diaChi,

            KHUVUC:data[id].khuVuc,

            QR:data[id].qrLink

        });

    }

    const worksheet =
    XLSX.utils.json_to_sheet(rows);

    const workbook =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "QR"
    );

    XLSX.writeFile(
        workbook,
        "DANH_SACH_QR.xlsx"
    );

}

// ====================================
// CAMERA
// ====================================

let qrScanner = null;

function startScanner(){

    if(qrScanner){

        return;
    }

    qrScanner =
    new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(devices=>{

        if(devices && devices.length){

            qrScanner.start(

                devices[0].id,

                {
                    fps:10,
                    qrbox:250
                },

                (decodedText)=>{

                    qrScanner.stop();

                    qrScanner = null;

                    verifyQR(decodedText);

                }

            );

        }

    });

}

// ====================================
// VERIFY QR
// ====================================

async function verifyQR(url){

    try{

        const parsed =
        new URL(url);

        const id =
        parsed.searchParams.get('id');

        const token =
        parsed.searchParams.get('token');

        const snapshot =
        await db.ref('recipients/'+id).once('value');

        const div =
        document.getElementById('scanResult');

        if(snapshot.exists()){

            const data =
            snapshot.val();

            if(data.token === token){

                if(data.received){

                    div.innerHTML = `

                    <div class="error">

                        ❌ ĐÃ NHẬN TRƯỚC ĐÓ

                    </div>

                    <br>

                    ${data.hoTen}

                    `;

                    restartScanner();

                    return;
                }

                await db.ref('recipients/'+id).update({

                    received:true,

                    scan:(data.scan || 0)+1

                });

                div.innerHTML = `

                <div class="success">

                    ✅ XÁC NHẬN THÀNH CÔNG

                </div>

                <br>

                <b>${data.hoTen}</b>

                <br><br>

                Đang quay lại quét tiếp...

                `;

                if(navigator.vibrate){

                    navigator.vibrate(300);
                }

                loadData();

                restartScanner();

            }else{

                div.innerHTML = `

                <div class="error">

                    ❌ QR KHÔNG HỢP LỆ

                </div>

                `;

                restartScanner();

            }

        }else{

            div.innerHTML = `

            <div class="error">

                ❌ KHÔNG TÌM THẤY

            </div>

            `;

            restartScanner();
        }

    }catch(err){

        console.log(err);

        restartScanner();

    }

}

// ====================================
// RESTART SCANNER
// ====================================

function restartScanner(){

    setTimeout(()=>{

        document.getElementById('scanResult').innerHTML='';

        startScanner();

    },2500);

}

// ====================================
// START
// ====================================

loadData();

startScanner();

</script>

</body>
</html>
