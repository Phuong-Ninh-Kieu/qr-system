<!DOCTYPE html>
<html lang="vi">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}
body{background:#eef2f7;padding-bottom:30px;}
.header{background:#b00000;color:#fff;padding:16px;text-align:center;border-bottom:4px solid #ffcc00;}
.header h1{font-size:22px;margin-bottom:5px;}
.container{width:95%;max-width:700px;margin:15px auto;}

.card h2{color:#b00000;font-size:18px;margin-bottom:15px;border-left:4px solid #b00000;padding-left:12px;}

.box{background:#b00000;color:#fff;padding:15px;border-radius:12px;text-align:center;}
.box h3{font-size:28px;margin-bottom:5px;}
.box p{font-size:12px;}
button{background:#b00000;color:#fff;padding:10px 16px;border:none;border-radius:10px;font-size:13px;font-weight:bold;margin:5px;cursor:pointer;}
button:active{opacity:0.8;}
.btn-green{background:#2e7d32;}
.btn-orange{background:#ff9800;}
.btn-blue{background:#2196f3;}

input{padding:12px;border:1px solid #ccc;border-radius:10px;margin:5px;}
.table-container{overflow-x:auto;}

.card-preview{width:280px;margin:auto;border:2px solid #b00000;padding:15px;border-radius:16px;background:#fff;}
.footer{text-align:center;padding:15px;color:#666;font-size:11px;}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:bold;}
.badge-success{background:#e8f5e9;color:#2e7d32;}
.badge-warning{background:#ffebee;color:#c62828;}
.export-buttons{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;}
.export-buttons button{flex:1;min-width:90px;font-size:12px;padding:8px;}
.action-buttons{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.action-buttons button{font-size:10px;padding:5px 8px;margin:1px;}
.camera-guide{background:#e3f2fd;padding:10px;border-radius:10px;margin-bottom:10px;font-size:12px;text-align:center;}
</style>
</head>
<body>

<div class="header">
    <h1>🏛️ ĐIỂM DANH QR</h1>
    <p>ỦY BAN NHÂN DÂN</p>
</div>

<div id="adminPanel" class="container"><div style="text-align:center;padding:20px;">⏳ Đang tải...</div></div>
<div id="verifyPanel" style="display:none;"></div>
<div class="footer">HỆ THỐNG ĐIỂM DANH QR</div>

<!-- Dùng thư viện tương thích iOS -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { 
    apiKey: "AIzaSyCnrj2LgPIhmHQ-2gFsj2WzEa1n0RzWrbw",
    authDomain: "van-ban-65d6c.firebaseapp.com",
    databaseURL: "https://van-ban-65d6c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "van-ban-65d6c",
    storageBucket: "van-ban-65d6c.firebasestorage.app",
    messagingSenderId: "841852290034",
    appId: "1:841852290034:web:21b9c176c86420b9f6216b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let html5QrCode = null;
let allUsersData = [];
let isScanning = false;

function randomToken(len=20){let s='';for(let i=0;i<len;i++)s+='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*62)];return s;}
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m;});}
function formatTime(d){return d.toLocaleTimeString('vi-VN');}
function formatDate(d){return d.toLocaleDateString('vi-VN');}
function getTodayStr(){return new Date().toISOString().split('T')[0];}
function getBaseUrl(){return window.location.href.split('?')[0];}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;}

// Kiểm tra xác thực từ QR
async function checkVerification(){
    let id = new URLSearchParams(location.search).get('id');
    let token = new URLSearchParams(location.search).get('token');
    if(!id && location.href.includes('?id=')){
        let m=location.href.match(/[?&]id=([^&]+)/);
        if(m)id=m[1];
        let tm=location.href.match(/[?&]token=([^&]+)/);
        if(tm)token=tm[1];
    }
    if(id&&token){
        document.getElementById('adminPanel').style.display='none';
        document.getElementById('verifyPanel').style.display='block';
        await doCheckin(id,token);
        return true;
    }
    return false;
}

async function doCheckin(id,token){
    let div=document.getElementById('verifyPanel');
    try{
        let snap=await get(child(ref(db),'users/'+id));
        if(!snap.exists()) throw new Error('Không tìm thấy');
        let data=snap.val();
        if(data.token!==token) throw new Error('Token sai');
        
        let today=getTodayStr();
        let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
        if(exist.exists()){
            let old=exist.val();
            div.innerHTML=`<div style="max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;"><div style="background:#ff9800;color:white;padding:20px;text-align:center;"><h2>⚠️ ĐÃ ĐIỂM DANH</h2></div><div style="padding:25px;text-align:center;"><div style="font-size:50px;">⏰</div><p><strong>${escapeHtml(data.fullname)}</strong></p><p>Giờ: ${old.time}</p><button onclick="location.href=location.pathname" style="width:100%;padding:12px;margin-top:15px;background:#ff9800;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
            return;
        }
        
        let now=new Date();
        await set(ref(db,'checkins/'+id+'/'+today),{
            userId:id,fullname:data.fullname,address:data.address,area:data.area,
            date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
        });
        let total=(data.totalCheckins||0)+1;
        await update(ref(db,'users/'+id),{totalCheckins:total});
        
        div.innerHTML=`<div style="max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;"><div style="background:#2e7d32;color:white;padding:20px;text-align:center;"><h2>✅ THÀNH CÔNG</h2></div><div style="padding:25px;text-align:center;"><div style="font-size:50px;">✅</div><p><strong>${escapeHtml(data.fullname)}</strong></p><p>⏰ ${formatTime(now)}</p><button onclick="location.href=location.pathname" style="width:100%;padding:12px;margin-top:15px;background:#2e7d32;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
        if(typeof loadData==='function') await loadData();
    }catch(e){
        div.innerHTML=`<div style="max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;"><div style="background:#b00000;color:white;padding:20px;text-align:center;"><h2>❌ KHÔNG HỢP LỆ</h2></div><div style="padding:25px;text-align:center;"><button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#b00000;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
    }
}

// ADMIN
async function renderAdmin(){
    let baseUrl=getBaseUrl();
    document.getElementById('adminPanel').innerHTML=`
        <div class="card"><h2>📊 THỐNG KÊ</h2><div class="dashboard">
            <div class="box"><h3 id="totalUsers">0</h3><p>TỔNG</p></div>
            <div class="box"><h3 id="totalCheckins">0</h3><p>ĐÃ ĐIỂM DANH</p></div>
            <div class="box"><h3 id="notCheckin">0</h3><p>CHƯA</p></div>
            <div class="box"><h3 id="checkinRate">0</h3><p>TỶ LỆ</p></div>
        </div></div>
        <div class="card"><h2>📂 IMPORT EXCEL</h2>
            <input type="file" id="excelFile" accept=".xlsx,.xls">
            <button id="importBtn">📤 IMPORT</button>
        </div>
        <div class="card"><h2>📷 QUÉT QR</h2>
            <div class="camera-guide">
                📱 <strong>Hướng dẫn:</strong> Cho phép truy cập camera → Chọn "Camera sau" → Đưa QR vào khung
            </div>
            <div id="qr-reader"></div>
            <div id="scanResult" style="margin-top:12px;font-size:13px;text-align:center;"></div>
        </div>
        <div class="card"><h2>📋 DANH SÁCH</h2>
            <div class="export-buttons">
                <button id="exportCheckedBtn" class="btn-green">📥 Đã điểm danh</button>
                <button id="exportUncheckedBtn" class="btn-orange">📥 Chưa điểm danh</button>
                <button id="exportAllBtn" class="btn-blue">📥 Tất cả</button>
            </div>
            <div class="table-container"><table><thead><tr><th>STT</th><th>HỌ TÊN</th><th>KHU VỰC</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody id="tableData"></tbody></table></div>
        </div>
        <div class="card"><h2>🖨️ THẺ QR</h2><div id="cardArea"></div></div>
    `;
    document.getElementById('importBtn').onclick=()=>importExcel(baseUrl);
    document.getElementById('exportCheckedBtn').onclick=()=>exportExcel('checked');
    document.getElementById('exportUncheckedBtn').onclick=()=>exportExcel('unchecked');
    document.getElementById('exportAllBtn').onclick=()=>exportExcel('all');
    await loadData();
    startCamera();
}

async function loadData(){
    let snap=await get(child(ref(db),'users'));
    let tbody=document.getElementById('tableData');
    if(!tbody) return;
    tbody.innerHTML='';
    let today=getTodayStr();
    let checkSnap=await get(child(ref(db),'checkins'));
    let checked={};
    if(checkSnap.exists()){
        for(let uid in checkSnap.val()){
            if(checkSnap.val()[uid][today]) checked[uid]=checkSnap.val()[uid][today];
        }
    }
    
    allUsersData=[];
    let total=0, checkedCount=0;
    if(snap.exists()){
        let data=snap.val();
        for(let id in data){
            total++;
            let isChecked=checked[id];
            if(isChecked) checkedCount++;
            let status=isChecked?`<span class="badge badge-success">✅ ${isChecked.time}</span>`:`<span class="badge badge-warning">⏳ Chưa</span>`;
            allUsersData.push({
                stt:data[id].stt, fullname:data[id].fullname, address:data[id].address,
                area:data[id].area, status:isChecked?'Đã điểm danh':'Chưa điểm danh',
                checkinTime:isChecked?isChecked.time:'---', userId:id, token:data[id].token
            });
            tbody.innerHTML+=`<tr>
                <td>${data[id].stt}</td>
                <td>${escapeHtml(data[id].fullname)}</td>
                <td>${escapeHtml(data[id].area)}</td>
                <td>${status}</td>
                <td class="action-buttons">
                    ${!isChecked?`<button class="btn-manual" onclick="manualCheckin('${id}')">📝 Thủ công</button>`:''}
                    <button onclick="showQR('${id}','${data[id].token}')">🔲 QR</button>
                </td>
            </tr>`;
        }
    }
    document.getElementById('totalUsers').innerText=total;
    document.getElementById('totalCheckins').innerText=checkedCount;
    document.getElementById('notCheckin').innerText=total-checkedCount;
    let rate=total>0?Math.round(checkedCount/total*100):0;
    document.getElementById('checkinRate').innerText=rate;
}

// Điểm danh thủ công
window.manualCheckin=async function(id){
    if(!confirm('Xác nhận điểm danh thủ công?')) return;
    let snap=await get(child(ref(db),'users/'+id));
    if(!snap.exists()){alert('Không tìm thấy');return;}
    let data=snap.val();
    let today=getTodayStr();
    let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
    if(exist.exists()){alert(`${data.fullname} đã điểm danh rồi!`);return;}
    let now=new Date();
    await set(ref(db,'checkins/'+id+'/'+today),{
        userId:id,fullname:data.fullname,address:data.address,area:data.area,
        date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
    });
    let total=(data.totalCheckins||0)+1;
    await update(ref(db,'users/'+id),{totalCheckins:total});
    alert(`✅ Điểm danh thành công: ${data.fullname}`);
    await loadData();
};

async function importExcel(baseUrl){
    let file=document.getElementById('excelFile').files[0];
    if(!file){alert('Chọn file Excel');return;}
    let reader=new FileReader();
    reader.onload=async function(e){
        let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        let sheet=wb.Sheets[wb.SheetNames[0]];
        let json=XLSX.utils.sheet_to_json(sheet);
        for(let item of json){
            let v=Object.values(item);
            let id='QR'+Date.now()+Math.floor(Math.random()*1000);
            let token=randomToken();
            await set(ref(db,'users/'+id),{
                stt:v[0]||'',fullname:v[1]||'',address:v[2]||'',area:v[3]||'',
                token:token,scan:0,totalCheckins:0,createdAt:new Date().toISOString()
            });
            await new Promise(r=>setTimeout(r,30));
        }
        alert('✅ Import thành công!');
        await loadData();
    };
    reader.readAsArrayBuffer(file);
}

function exportExcel(type){
    let data=[], filename=`DANH_SACH_${formatDate(new Date())}.xlsx`;
    if(type==='checked') data=allUsersData.filter(u=>u.status==='Đã điểm danh');
    else if(type==='unchecked') data=allUsersData.filter(u=>u.status==='Chưa điểm danh');
    else data=allUsersData;
    if(data.length===0){alert('Không có dữ liệu!');return;}
    let exportData=data.map((item,i)=>({
        'STT':i+1,'HỌ TÊN':item.fullname,'ĐỊA CHỈ':item.address,
        'KHU VỰC':item.area,'TRẠNG THÁI':item.status,'GIỜ CHECK-IN':item.checkinTime
    }));
    let ws=XLSX.utils.json_to_sheet(exportData);
    let wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'DanhSach');
    XLSX.writeFile(wb,filename);
    alert(`✅ Xuất ${data.length} người`);
}

window.showQR=function(id,token){
    let url=getBaseUrl()+'?id='+id+'&token='+token;
    document.getElementById('cardArea').innerHTML=`<div class="card-preview" id="pdfCard"><h3>🎫 THẺ ĐIỂM DANH</h3><div id="qrcode"></div><p>${id}</p></div>`;
    new QRCode(document.getElementById('qrcode'),{text:url,width:200,height:200});
    setTimeout(()=>{
        let btn=document.createElement('button');
        btn.innerHTML='📄 Xuất PDF';
        btn.onclick=()=>exportPDF(id);
        btn.style.marginTop='10px';
        btn.style.padding='8px';
        document.getElementById('pdfCard').appendChild(btn);
    },100);
};

window.exportPDF=async function(id){
    let card=document.getElementById('pdfCard');
    if(!card){alert('Tạo QR trước');return;}
    let canvas=await html2canvas(card);
    let {jsPDF}=window.jspdf;
    let pdf=new jsPDF();
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',10,10,80,100);
    pdf.save(id+'.pdf');
};

// Camera - Tương thích iOS và Android
async function startCamera(){
    let readerDiv=document.getElementById('qr-reader');
    if(!readerDiv) return;
    
    if(html5QrCode){
        try{await html5QrCode.stop();}catch(e){}
        html5QrCode.clear();
    }
    
    html5QrCode = new Html5Qrcode("qr-reader");
    
    try{
        let devices = await Html5Qrcode.getCameras();
        if(!devices || devices.length === 0){
            document.getElementById('scanResult').innerHTML='❌ Không tìm thấy camera';
            return;
        }
        
        // Tìm camera sau (back camera)
        let backCamera = devices.find(device => 
            device.label.toLowerCase().includes('back') || 
            device.label.toLowerCase().includes('environment') ||
            device.label.toLowerCase().includes('rear') ||
            device.label.toLowerCase().includes('camera 1')
        );
        
        let cameraId = backCamera ? backCamera.id : devices[0].id;
        let cameraName = backCamera ? 'Camera sau' : (devices[0].label || 'Camera mặc định');
        
        document.getElementById('scanResult').innerHTML=`📷 Đang khởi động ${cameraName}...`;
        
        await html5QrCode.start(cameraId, {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        }, onScanSuccess, onScanError);
        
        document.getElementById('scanResult').innerHTML=`✅ ${cameraName} đã sẵn sàng! Đưa QR vào khung.`;
        
    } catch(err){
        console.log('Camera error:', err);
        document.getElementById('scanResult').innerHTML=`⚠️ Không thể mở camera. Vui lòng:<br>
        1. Cho phép truy cập camera<br>
        2. Nếu trên iPhone, vào Cài đặt → Safari → Cho phép camera<br>
        3. Tải lại trang`;
    }
}

function onScanSuccess(decodedText, decodedResult){
    if(isScanning) return;
    isScanning = true;
    
    try{
        let url = new URL(decodedText);
        let id = url.searchParams.get('id');
        let token = url.searchParams.get('token');
        if(id && token){
            processScan(id, token);
        } else {
            document.getElementById('scanResult').innerHTML='✗ QR không đúng định dạng';
        }
    } catch(e){
        document.getElementById('scanResult').innerHTML='✗ QR không hợp lệ';
    }
    
    setTimeout(() => { isScanning = false; }, 2000);
}

function onScanError(error){
    // Không hiển thị lỗi liên tục để tránh spam
    // console.log(error);
}

async function processScan(id, token){
    let snap=await get(child(ref(db),'users/'+id));
    let resDiv=document.getElementById('scanResult');
    
    if(!snap.exists()){
        resDiv.innerHTML='❌ Không tìm thấy người dùng';
        return;
    }
    
    let data=snap.val();
    if(data.token!==token){
        resDiv.innerHTML='❌ QR không hợp lệ';
        return;
    }
    
    let today=getTodayStr();
    let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
    if(exist.exists()){
        resDiv.innerHTML=`⚠️ ${data.fullname} đã điểm danh lúc ${exist.val().time}`;
        return;
    }
    
    let now=new Date();
    await set(ref(db,'checkins/'+id+'/'+today),{
        userId:id,fullname:data.fullname,address:data.address,area:data.area,
        date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
    });
    let total=(data.totalCheckins||0)+1;
    await update(ref(db,'users/'+id),{totalCheckins:total});
    
    resDiv.innerHTML=`✅ THÀNH CÔNG! ${data.fullname} - ${formatTime(now)}`;
    await loadData();
}

let isVerifying=await checkVerification();
if(!isVerifying) await renderAdmin();
</script>
</body>
</html>
