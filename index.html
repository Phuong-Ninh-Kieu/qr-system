function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m;});}
function formatTime(d){return d.toLocaleTimeString('vi-VN');}
function formatDate(d){return d.toLocaleDateString('vi-VN');}
function getTodayStr(){return new Date().toISOString().split('T')[0];}
function getBaseUrl(){return window.location.href.split('?')[0];}

// XÁC THỰC QUÉT QR
async function checkVerification(){
    let id = new URLSearchParams(location.search).get('id');
    if(id){
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('verifyPanel').style.display = 'block';
        await processCheckin(id);
        return true;
    }
    return false;
}

async function processCheckin(id){
    let div = document.getElementById('verifyPanel');
    try{
        let snap = await get(child(ref(db), 'recipients/'+id));
        if(!snap.exists()){
            div.innerHTML = `<div class="verify-card"><h3>❌ MÃ KHÔNG HỢP LỆ</h3><button onclick="location.href=location.pathname">Đóng</button></div>`;
            return;
        }
        let data = snap.val();
        let today = getTodayStr();
        let received = await get(child(ref(db), 'received/'+id+'/'+today));
        if(received.exists()){
            div.innerHTML = `<div class="verify-card"><h3>⚠️ ĐÃ NHẬN QUÀ</h3><p>Thời gian: ${received.val().time}</p><button onclick="location.href=location.pathname">Đóng</button></div>`;
            return;
        }
        let now = new Date();
        await set(ref(db, 'received/'+id+'/'+today), {
            id, hoTen: data.hoTen, diaChi: data.diaChi,
            time: formatTime(now), datetime: now.toISOString()
        });
        await update(ref(db, 'recipients/'+id), { received: true, receivedTime: formatTime(now) });
        div.innerHTML = `<div class="verify-card"><h3>✅ NHẬN QUÀ THÀNH CÔNG</h3><p>⏰ ${formatTime(now)}</p><button onclick="location.href=location.pathname">Xác nhận</button></div>`;
        if(isAdmin) await loadData();
    }catch(e){ div.innerHTML = `<div class="verify-card"><h3>❌ LỖI</h3><button onclick="location.reload()">Thử lại</button></div>`; }
}

// XUẤT EXCEL CÓ HÌNH QR
async function exportExcelWithQR(){
    if(allRecipients.length===0){ alert('Chưa có dữ liệu'); return; }
    let btn = document.getElementById('exportQrBtn');
    let oldText = btn.innerHTML;
    btn.innerHTML = '⏳ Đang tạo...';
    btn.disabled = true;
    
    try{
        let workbook = XLSX.utils.book_new();
        let sheetData = [['STT', 'HỌ VÀ TÊN', 'ĐỊA CHỈ', 'THUỘC DIỆN', 'KHU VỰC', 'GHI CHÚ', 'MÃ QR']];
        
        for(let i=0; i<allRecipients.length; i++){
            let r = allRecipients[i];
            sheetData.push([
                r.stt || i+1, r.hoTen, r.diaChi, r.thuocDien || '', r.khuVuc || '', r.ghiChu || '', r.qrUrl
            ]);
        }
        
        let ws = XLSX.utils.aoa_to_sheet(sheetData);
        ws['!cols'] = [{wch:6},{wch:25},{wch:35},{wch:20},{wch:12},{wch:20},{wch:50}];
        XLSX.utils.book_append_sheet(workbook, ws, 'DanhSach');
        XLSX.writeFile(workbook, `DANH_SACH_CO_QR_${formatDate(new Date())}.xlsx`);
        alert(`✅ Đã xuất ${allRecipients.length} người có link QR`);
    }catch(e){ alert('Lỗi: '+e.message); }
    finally{ btn.innerHTML = oldText; btn.disabled = false; }
}

// XUẤT EXCEL CƠ BẢN
function exportBasicExcel(){
    if(allRecipients.length===0){ alert('Chưa có dữ liệu'); return; }
    let data = allRecipients.map((r,i)=>({
        'STT': r.stt||i+1, 'HỌ TÊN': r.hoTen, 'ĐỊA CHỈ': r.diaChi,

        'TRẠNG THÁI': r.received?'Đã nhận':'Chưa nhận', 'GIỜ NHẬN': r.receivedTime||'---'
    }));
    let ws = XLSX.utils.json_to_sheet(data);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'BaoCao');
    XLSX.writeFile(wb, `BAO_CAO_${formatDate(new Date())}.xlsx`);

}

async function importExcel(){
    let file = document.getElementById('excelFile').files[0];
    if(!file){ alert('Chọn file Excel'); return; }
    let reader = new FileReader();
    reader.onload = async function(e){
        let wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        let sheet = wb.Sheets[wb.SheetNames[0]];
        let json = XLSX.utils.sheet_to_json(sheet);
        let success=0;
        for(let item of json){
            let keys = Object.keys(item);
            let hoTen = '', diaChi = '', thuocDien='', khuVuc='', ghiChu='', stt='';
            for(let k of keys){
                let low = k.toLowerCase();
                if(low.includes('tên')||low.includes('họ')) hoTen = item[k];
                if(low.includes('địa chỉ')||low.includes('địa')) diaChi = item[k];
                if(low.includes('diện')) thuocDien = item[k];
                if(low.includes('khu vực')||low.includes('khu')) khuVuc = item[k];
                if(low.includes('ghi chú')) ghiChu = item[k];
                if(low.includes('stt')) stt = item[k];
            }
            if(!hoTen || !diaChi) continue;
            let id = randomId();
            let qrUrl = getBaseUrl() + '?id=' + id;
            await set(ref(db, 'recipients/'+id), {
                id, stt: stt||'', hoTen, diaChi, thuocDien: thuocDien||'', khuVuc: khuVuc||'', ghiChu: ghiChu||'',
                qrUrl, received: false, createdAt: new Date().toISOString()
            });
            success++;
        }
        alert(`✅ Import ${success} người`);
        await loadData();
    };
    reader.readAsArrayBuffer(file);
}

async function loadData(){
    let snap = await get(child(ref(db), 'recipients'));
    let today = getTodayStr();
    let recSnap = await get(child(ref(db), 'received'));
    let receivedToday = {};
    if(recSnap.exists()){
        for(let uid in recSnap.val()){
            if(recSnap.val()[uid][today]) receivedToday[uid] = recSnap.val()[uid][today];
        }
    }
    allRecipients = [];
    let total=0, recCount=0, areas=new Set();
    if(snap.exists()){
        for(let id in snap.val()){
            let r = snap.val()[id];
            total++;
            let isRec = receivedToday[id]?true:false;
            if(isRec) recCount++;
            if(r.khuVuc) areas.add(r.khuVuc);
            allRecipients.push({
                id, stt: r.stt, hoTen: r.hoTen, diaChi: r.diaChi,
                thuocDien: r.thuocDien||'', khuVuc: r.khuVuc||'', ghiChu: r.ghiChu||'',
                received: isRec, receivedTime: receivedToday[id]?.time||null, qrUrl: r.qrUrl
            });
        }
    }
    let areaSelect = document.getElementById('areaFilter');
    if(areaSelect){
        let val = areaSelect.value;
        areaSelect.innerHTML = '<option value="all">Tất cả KV</option>';
        [...areas].sort().forEach(a=>{ if(a) areaSelect.innerHTML += `<option value="${a}">${a}</option>`; });
        if(val && areaSelect.querySelector(`option[value="${val}"]`)) areaSelect.value=val;
    }
    document.getElementById('total').innerText = total;
    document.getElementById('received').innerText = recCount;
    document.getElementById('notReceived').innerText = total-recCount;
    document.getElementById('rate').innerText = total>0?Math.round(recCount/total*100):0;
    filterTable();
}

function filterTable(){
    let search = document.getElementById('search').value.toLowerCase();
    let status = document.getElementById('statusFilter').value;
    let area = document.getElementById('areaFilter').value;
    let filtered = allRecipients.filter(r => {
        let match = r.hoTen.toLowerCase().includes(search) || r.diaChi.toLowerCase().includes(search);
        let matchStatus = status==='all' || (status==='received' && r.received) || (status==='not' && !r.received);
        let matchArea = area==='all' || r.khuVuc===area;
        return match && matchStatus && matchArea;
    });
    let tbody = document.getElementById('tableBody');
    if(filtered.length===0){ tbody.innerHTML='<tr><td colspan="7">📭 Không có dữ liệu</td></tr>'; return; }
    tbody.innerHTML = '';
    filtered.forEach((r,i)=>{
        let statusHtml = r.received ? `<span class="badge-success">✅ Đã nhận<br>${r.receivedTime}</span>` : `<span class="badge-warning">⏳ Chưa nhận</span>`;
        tbody.innerHTML += `<tr>
            <td>${r.stt||i+1}</td>
            <td style="text-align:left">${escapeHtml(r.hoTen)}</td>
            <td style="text-align:left">${escapeHtml(r.diaChi)}</td>
            <td>${escapeHtml(r.thuocDien)||'---'}</td>
            <td>${escapeHtml(r.khuVuc)||'---'}</td>
            <td>${statusHtml}</td>
            <td><button class="view-qr" data-id="${r.id}" style="background:#2196f3;padding:4px 10px;">🔲 QR</button></td>
        </tr>`;
    });
    document.querySelectorAll('.view-qr').forEach(btn=>{ btn.onclick=()=>showQR(btn.dataset.id); });
}

// ĐĂNG NHẬP
function login(){
    let pwd = document.getElementById('adminPassword').value;
    if(pwd === ADMIN_PASSWORD){
        isAdmin=true;
        document.getElementById('loginPanel').style.display='none';
        document.getElementById('adminPanel').style.display='block';
        document.querySelectorAll('.admin-content').forEach(el=>el.style.display='block');
        renderAdmin();
    }else{
        document.getElementById('loginError').style.display='block';
    }
}

let verifying = await checkVerification();
if(!verifying){
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('adminPassword').onkeypress = e => { if(e.key==='Enter') login(); };
}
</script>
