function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m;});}
function formatTime(d){return d.toLocaleTimeString('vi-VN');}
function formatDate(d){return d.toLocaleDateString('vi-VN');}
function getTodayStr(){return new Date().toISOString().split('T')[0];}
function getBaseUrl(){return window.location.href.split('?')[0];}
function randomId(){return 'HD' + Date.now() + Math.floor(Math.random()*10000);}
function removeVietnameseTones(str) {
    if(!str) return '';
    str = str.replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, 'a');
    str = str.replace(/[èéẹẻẽêềếệểễ]/g, 'e');
    str = str.replace(/[ìíịỉĩ]/g, 'i');
    str = str.replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, 'o');
    str = str.replace(/[ùúụủũưừứựửữ]/g, 'u');
    str = str.replace(/[ỳýỵỷỹ]/g, 'y');
    str = str.replace(/đ/g, 'd');
    str = str.replace(/Đ/g, 'D');
    str = str.replace(/[^a-zA-Z0-9]/g, '_');
    return str;
}

// KIỂM TRA XÁC THỰC KHI QUÉT QR
async function checkVerification(){
    let id = new URLSearchParams(location.search).get('id');
    if(id){
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('verifyPanel').style.display = 'block';
        await processReceiveGift(id);
        return true;
    }
    return false;
}

async function processReceiveGift(recipientId){
    let div = document.getElementById('verifyPanel');
    try{
        let snap = await get(child(ref(db), 'recipients/' + recipientId));
        if(!snap.exists()){
            div.innerHTML = `<div class="verify-card"><div class="verify-header"><h2>❌ KHÔNG HỢP LỆ</h2></div><div class="verify-content"><p>Mã QR không hợp lệ hoặc đã bị hủy!</p><button onclick="location.href=location.pathname" style="padding:12px 20px;background:#b00000;color:white;border:none;border-radius:8px;">ĐÓNG</button></div></div>`;
            return;
        }
        
        let recipient = snap.val();
        let today = getTodayStr();
        let received = await get(child(ref(db), 'received/' + recipientId + '/' + today));
        
        if(received.exists()){
            div.innerHTML = `<div class="verify-card"><div class="verify-header" style="background:#ff9800;"><h2>⚠️ ĐÃ NHẬN QUÀ</h2></div><div class="verify-content"><div style="font-size:50px;">⏰</div><p>Mã QR này đã được sử dụng!</p><p>Thời gian: ${received.val().time}</p><button onclick="location.href=location.pathname" style="padding:12px 20px;background:#ff9800;border:none;border-radius:8px;">ĐÓNG</button></div></div>`;
            return;
        }
        
        let now = new Date();
        await set(ref(db, 'received/' + recipientId + '/' + today), {
            recipientId: recipientId,
            hoTen: recipient.hoTen,
            diaChi: recipient.diaChi,
            thuocDien: recipient.thuocDien || '',
            khuVuc: recipient.khuVuc || '',
            ghiChu: recipient.ghiChu || '',
            time: formatTime(now),
            datetime: now.toISOString(),
            nguoiXuLy: 'QR Scan'
        });
        
        let totalReceived = (recipient.totalReceived || 0) + 1;
        await update(ref(db, 'recipients/' + recipientId), { totalReceived: totalReceived, lastReceived: now.toISOString() });
        
        div.innerHTML = `<div class="verify-card"><div class="verify-header" style="background:#2e7d32;"><h2>✅ NHẬN QUÀ THÀNH CÔNG</h2></div><div class="verify-content"><div style="font-size:50px;">🎁</div><p>Cảm ơn quý vị đã đến nhận quà!</p><p>⏰ ${formatTime(now)}</p><button onclick="location.href=location.pathname" style="padding:12px 20px;background:#2e7d32;border:none;border-radius:8px;">XÁC NHẬN</button></div></div>`;
        
        if(isAdminLoggedIn && typeof loadData === 'function') await loadData();
        
    } catch(e){
        div.innerHTML = `<div class="verify-card"><div class="verify-header"><h2>❌ LỖI</h2></div><div class="verify-content"><button onclick="location.reload()" style="padding:12px 20px;">THỬ LẠI</button></div></div>`;
    }
}

function getValueByKeys(obj, possibleKeys) {
    for(let key of possibleKeys) {
        let foundKey = Object.keys(obj).find(k => k.toLowerCase() === key.toLowerCase());
        if(foundKey && obj[foundKey]) return obj[foundKey].toString().trim();
    }
    return '';
}

// ========== XUẤT EXCEL CÓ MÃ QR (THƯ MỜI) ==========
async function exportExcelWithQR() {
    if(allRecipients.length === 0){
        alert('Chưa có dữ liệu. Vui lòng import danh sách trước.');
        return;
    }
    
    // Hiển thị loading
    let exportBtn = document.getElementById('exportQRExcelBtn');
    let originalText = exportBtn.innerHTML;
    exportBtn.innerHTML = '⏳ Đang tạo...';
    exportBtn.disabled = true;
    
    try {
        // Tạo dữ liệu xuất với link QR
        let exportData = allRecipients.map((r, i) => ({
            'STT': r.stt || i+1,
            'HỌ VÀ TÊN': r.hoTen,
            'ĐỊA CHỈ': r.diaChi,
            'THUỘC DIỆN': r.thuocDien || '',
            'KHU VỰC': r.khuVuc || '',
            'GHI CHÚ': r.ghiChu || '',
            'MÃ QR (Link)': r.qrUrl,
            'HƯỚNG DẪN': 'Quét mã QR hoặc bấm vào link để điểm danh'
        }));
        
        let ws = XLSX.utils.json_to_sheet(exportData);
        
        // Độ rộng cột
        ws['!cols'] = [
            {wch:8}, {wch:25}, {wch:35}, {wch:20}, {wch:15}, {wch:20}, {wch:50}, {wch:30}
        ];
        
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'DanhSach_Co_QR');
        
        // Xuất file
        XLSX.writeFile(wb, `DANH_SACH_THU_MOI_CO_QR_${formatDate(new Date())}.xlsx`);
        alert(`✅ Đã xuất ${allRecipients.length} thư mời có mã QR vào file Excel!`);
        
    } catch(err) {
        alert('❌ Lỗi: ' + err.message);
    } finally {
        exportBtn.innerHTML = originalText;
        exportBtn.disabled = false;
    }
}

async function executeDelete() {
    let confirmInput = document.getElementById('confirmDeleteInput');
    let confirmText = confirmInput ? confirmInput.value.trim() : '';
    
    if(deleteType === 'all') {
        if(confirmText !== 'XÓA TOÀN BỘ') { alert('Vui lòng gõ "XÓA TOÀN BỘ"'); return; }
        if(confirm('XÓA TOÀN BỘ?')) {
            await remove(ref(db, 'recipients'));
            await remove(ref(db, 'received'));
            alert('✅ Đã xóa!');
            await loadData();
        }
    }
    else if(deleteType === 'today') {
        if(confirmText !== 'XÓA') { alert('Vui lòng gõ "XÓA"'); return; }
        let today = getTodayStr();
        let receivedSnap = await get(child(ref(db), 'received'));
        if(receivedSnap.exists()) {
            for(let userId in receivedSnap.val()) {
                if(receivedSnap.val()[userId][today]) {
                    await remove(ref(db, 'received/' + userId + '/' + today));
                }
            }
        }
        alert('✅ Đã xóa!');
        await loadData();
    }
    else if(deleteType === 'area') {
        if(confirmText !== 'XÓA') { alert('Vui lòng gõ "XÓA"'); return; }
        let area = document.getElementById('areaToDelete')?.value;
        if(!area) { alert('Chọn khu vực'); return; }
        let personsToDelete = allRecipients.filter(r => r.khuVuc === area);
        for(let person of personsToDelete) {
            await remove(ref(db, 'recipients/' + person.id));
            await remove(ref(db, 'received/' + person.id));
        }
        alert(`✅ Đã xóa ${personsToDelete.length} người!`);
        await loadData();
    }
    else if(deleteType === 'person') {
        if(confirmText !== 'XÓA') { alert('Vui lòng gõ "XÓA"'); return; }
        await remove(ref(db, 'recipients/' + window.personToDelete.id));
        await remove(ref(db, 'received/' + window.personToDelete.id));
        alert(`✅ Đã xóa!`);
        await loadData();
    }
    document.getElementById('deleteConfirmModal').style.display = 'none';
    deleteType = null;
}

async function importExcel(baseUrl){
    let file = document.getElementById('excelFile').files[0];
    let msgDiv = document.getElementById('importMessage');
    let successDiv = document.getElementById('importSuccess');
    msgDiv.style.display = 'none';
    successDiv.style.display = 'none';
    if(!file){ msgDiv.innerHTML = '❌ Chọn file Excel'; msgDiv.style.display = 'block'; return; }
    
    let reader = new FileReader();
    reader.onload = async function(e){
        try {
            let wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            let sheet = wb.Sheets[wb.SheetNames[0]];
            let json = XLSX.utils.sheet_to_json(sheet);
            if(json.length === 0) throw new Error('File không có dữ liệu');
            
            let successCount = 0;
            for(let item of json){
                let stt = getValueByKeys(item, ['STT','Stt','stt']);
                let hoTen = getValueByKeys(item, ['HỌ VÀ TÊN','HỌ TÊN','Họ và tên']);
                let diaChi = getValueByKeys(item, ['ĐỊA CHỈ','Địa chỉ']);
                let thuocDien = getValueByKeys(item, ['THUỘC DIỆN','Thuộc diện']);
                let khuVuc = getValueByKeys(item, ['KHU VỰC','Khu vực']);
                let ghiChu = getValueByKeys(item, ['GHI CHÚ','Ghi chú']);
                if(!hoTen || !diaChi) continue;
                let recipientId = randomId();
                let qrUrl = baseUrl + '?id=' + recipientId;
                await set(ref(db, 'recipients/' + recipientId), {
                    id: recipientId, stt: stt || successCount+1, hoTen, diaChi,
                    thuocDien: thuocDien || '', khuVuc: khuVuc || '', ghiChu: ghiChu || '',
                    qrUrl, totalReceived: 0, createdAt: new Date().toISOString()
                });
                successCount++;
                await new Promise(r => setTimeout(r, 20));
            }
            successDiv.innerHTML = `✅ Import thành công: ${successCount} người`;
            successDiv.style.display = 'block';
            if(successCount > 0) await loadData();
            setTimeout(() => successDiv.style.display = 'none', 5000);
        } catch(err) {
            msgDiv.innerHTML = '❌ Lỗi: ' + err.message;
            msgDiv.style.display = 'block';
        }
    };
    reader.readAsArrayBuffer(file);
}

async function loadData(){
    let snap = await get(child(ref(db), 'recipients'));
    let tbody = document.getElementById('tableData');
    if(!tbody) return;
    let today = getTodayStr();
    let receivedSnap = await get(child(ref(db), 'received'));
    let receivedToday = {};
    if(receivedSnap.exists()){
        for(let fid in receivedSnap.val()){
            if(receivedSnap.val()[fid][today]) receivedToday[fid] = receivedSnap.val()[fid][today];
        }
    }
    allRecipients = [];
    let total = 0, receivedCount = 0;
    let areas = new Set();
    if(snap.exists()){
        let data = snap.val();
        for(let id in data){
            total++;
            let r = data[id];
            let isReceived = receivedToday[id];
            if(isReceived) receivedCount++;
            if(r.khuVuc) areas.add(r.khuVuc);
            allRecipients.push({
                id, stt: r.stt, hoTen: r.hoTen, diaChi: r.diaChi,
                thuocDien: r.thuocDien || '', khuVuc: r.khuVuc || '',
                ghiChu: r.ghiChu || '', received: isReceived || false,
                receivedTime: isReceived ? isReceived.time : null, qrUrl: r.qrUrl
            });
        }
    }
    let areaSelect = document.getElementById('filterArea');
    if(areaSelect){
        let currentValue = areaSelect.value;
        areaSelect.innerHTML = '<option value="all">🗺️ Tất cả khu vực</option>';
        Array.from(areas).sort().forEach(area => {
            if(area) areaSelect.innerHTML += `<option value="${escapeHtml(area)}">${escapeHtml(area)}</option>`;
        });
        if(currentValue && areaSelect.querySelector(`option[value="${currentValue}"]`)) areaSelect.value = currentValue;
    }
    document.getElementById('totalRecipients').innerText = total;
    document.getElementById('receivedToday').innerText = receivedCount;
    document.getElementById('notReceived').innerText = total - receivedCount;
    document.getElementById('percentRate').innerText = total > 0 ? Math.round(receivedCount / total * 100) : 0;
    filterTable();
}

function filterTable(){
    let searchText = document.getElementById('searchInput').value.toLowerCase();
    let status = document.getElementById('filterStatus').value;
    let filterArea = document.getElementById('filterArea').value;
    let tbody = document.getElementById('tableData');
    let filtered = allRecipients.filter(r => {
        let matchSearch = (r.hoTen && r.hoTen.toLowerCase().includes(searchText)) || (r.diaChi && r.diaChi.toLowerCase().includes(searchText));
        let matchStatus = status === 'all' || (status === 'received' && r.received) || (status === 'notreceived' && !r.received);
        let matchArea = filterArea === 'all' || r.khuVuc === filterArea;
        return matchSearch && matchStatus && matchArea;
    });
    if(filtered.length === 0){ tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;">📭 Không có dữ liệu</td></tr>'; return; }
    tbody.innerHTML = '';
    filtered.forEach((r, idx) => {
        let statusHtml = r.received ? `<span class="badge-success">✅ Đã nhận<br>${r.receivedTime}</span>` : `<span class="badge-warning">⏳ Chưa nhận</span>`;
        tbody.innerHTML += `<tr>
            <td>${r.stt || idx+1}</td>
            <td style="text-align:left;">${escapeHtml(r.hoTen)}</td>
            <td style="text-align:left;">${escapeHtml(r.diaChi)}</td>
            <td>${escapeHtml(r.thuocDien) || '---'}</td>
            <td>${escapeHtml(r.khuVuc) || '---'}</td>
            <td>${escapeHtml(r.ghiChu) || '---'}</td>
            <td>${statusHtml}</td>
            <td>${r.receivedTime || '---'}</td>
            <td><button class="btn-view-qr" data-id="${r.id}" style="background:#2196f3;">🔲 QR</button></td>
            <td><button class="btn-view-invite" data-id="${r.id}" style="background:#8d6e63;">📜 Thư mời</button></td>
            <td><button class="btn-delete-person" data-id="${r.id}" data-name="${escapeHtml(r.hoTen)}" style="background:#c62828;">🗑️ Xóa</button></td>
        </tr>`;
    });
    document.querySelectorAll('.btn-view-qr').forEach(btn => { btn.onclick = () => showQRModal(btn.getAttribute('data-id')); });
    document.querySelectorAll('.btn-view-invite').forEach(btn => { btn.onclick = () => showInviteModal(btn.getAttribute('data-id')); });
    document.querySelectorAll('.btn-delete-person').forEach(btn => { btn.onclick = () => deleteSinglePerson(btn.getAttribute('data-id'), btn.getAttribute('data-name')); });
}
