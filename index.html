function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m;});}
function formatTime(d){return d.toLocaleTimeString('vi-VN');}
function formatDate(d){return d.toLocaleDateString('vi-VN');}
function getTodayStr(){return new Date().toISOString().split('T')[0];}
function getBaseUrl(){return window.location.href.split('?')[0];}
function randomId(){return 'HD' + Date.now() + Math.floor(Math.random()*10000);}

// KIỂM TRA XÁC THỰC KHI QUÉT QR
async function checkVerification(){
    let id = new URLSearchParams(location.search).get('id');
    if(id){
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('verifyPanel').style.display = 'block';
        await processReceiveGift(id);
        return true;
    }
    return false;
}

async function processReceiveGift(recipientId){
    let div = document.getElementById('verifyPanel');
    try{
        let snap = await get(child(ref(db), 'recipients/' + recipientId));
        if(!snap.exists()){
            div.innerHTML = `<div class="verify-card"><div class="verify-header"><h2>❌ KHÔNG HỢP LỆ</h2></div><div class="verify-content"><p>Mã QR không hợp lệ</p><button onclick="location.href=location.pathname" style="padding:12px 20px;background:#b00000;color:white;border:none;border-radius:8px;">ĐÓNG</button></div></div>`;
            return;
        }
        
        let recipient = snap.val();
        let today = getTodayStr();
        let received = await get(child(ref(db), 'received/' + recipientId + '/' + today));
        
        if(received.exists()){
            div.innerHTML = `<div class="verify-card"><div class="verify-header" style="background:#ff9800;"><h2>⚠️ ĐÃ NHẬN QUÀ</h2></div><div class="verify-content"><div style="font-size:50px;">⏰</div><p><strong>${escapeHtml(recipient.hoTen)}</strong></p><p>Địa chỉ: ${escapeHtml(recipient.diaChi)}</p><p>Đã nhận lúc: ${received.val().time}</p><button onclick="location.href=location.pathname" style="padding:12px 20px;background:#ff9800;border:none;border-radius:8px;">ĐÓNG</button></div></div>`;
            return;
        }
        
        let now = new Date();
        await set(ref(db, 'received/' + recipientId + '/' + today), {
            recipientId: recipientId,
            hoTen: recipient.hoTen,
            diaChi: recipient.diaChi,
            thuocDien: recipient.thuocDien || '',
            khuVuc: recipient.khuVuc || '',
            ghiChu: recipient.ghiChu || '',
            time: formatTime(now),
            datetime: now.toISOString(),
            nguoiXuLy: 'QR Scan'
        });
        
        let totalReceived = (recipient.totalReceived || 0) + 1;
        await update(ref(db, 'recipients/' + recipientId), { totalReceived: totalReceived, lastReceived: now.toISOString() });
        
        div.innerHTML = `<div class="verify-card"><div class="verify-header" style="background:#2e7d32;"><h2>✅ NHẬN QUÀ THÀNH CÔNG</h2></div><div class="verify-content"><div style="font-size:50px;">🎁</div><p><strong>${escapeHtml(recipient.hoTen)}</strong></p><p>🏠 ${escapeHtml(recipient.diaChi)}</p>${recipient.thuocDien ? `<p>📋 Thuộc diện: ${escapeHtml(recipient.thuocDien)}</p>` : ''}${recipient.khuVuc ? `<p>🗺️ Khu vực: ${escapeHtml(recipient.khuVuc)}</p>` : ''}<p>⏰ ${formatTime(now)}</p><button onclick="location.href=location.pathname" style="padding:12px 20px;background:#2e7d32;border:none;border-radius:8px;">XÁC NHẬN</button></div></div>`;
        
        if(typeof loadData === 'function') await loadData();
        
    } catch(e){
        div.innerHTML = `<div class="verify-card"><div class="verify-header"><h2>❌ LỖI</h2></div><div class="verify-content"><button onclick="location.reload()" style="padding:12px 20px;">THỬ LẠI</button></div></div>`;
    }
}

// Hàm lấy giá trị từ object không phân biệt hoa thường
function getValueByKeys(obj, possibleKeys) {
    for(let key of possibleKeys) {
        let foundKey = Object.keys(obj).find(k => k.toLowerCase() === key.toLowerCase());
        if(foundKey && obj[foundKey]) {
            return obj[foundKey].toString().trim();
        }
    }
    return '';
}

// HIỂN THỊ QR MODAL
function showQRModal(recipientId){
    let recipient = allRecipients.find(r => r.id === recipientId);
    if(!recipient) return;
    
    currentRecipient = recipient;
    let modal = document.getElementById('qrModal');
    let modalQR = document.getElementById('modalQRCode');
    let modalInfo = document.getElementById('modalInfo');
    
    // Xóa QR cũ
    modalQR.innerHTML = '';
    
    // Tạo QR mới
    new QRCode(modalQR, {
        text: recipient.qrUrl,
        width: 220,
        height: 220
    });
    
    // Hiển thị thông tin
    modalInfo.innerHTML = `
        <p style="font-size:18px;font-weight:bold;margin:10px 0;">${escapeHtml(recipient.hoTen)}</p>
        <p>🏠 ${escapeHtml(recipient.diaChi)}</p>
        ${recipient.thuocDien ? `<p>📋 ${escapeHtml(recipient.thuocDien)}</p>` : ''}
        ${recipient.khuVuc ? `<p>🗺️ ${escapeHtml(recipient.khuVuc)}</p>` : ''}
        <p style="font-size:12px;color:#666;margin-top:10px;">Mã số: ${recipient.id}</p>
    `;
    
    modal.style.display = 'flex';
}

                const card = document.createElement('div');
                card.className = 'qr-card';

                card.innerHTML = \`
                    <div id="\${qrId}"></div>

                    <p>\${recipient.diaChi}</p>
                    \${recipient.khuVuc ? '<p>🗺️ ' + recipient.khuVuc + '</p>' : ''}

async function importExcel(baseUrl){
    let file = document.getElementById('excelFile').files[0];
    let msgDiv = document.getElementById('importMessage');
    let successDiv = document.getElementById('importSuccess');
    
    msgDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    if(!file){ 
        msgDiv.innerHTML = '❌ Chọn file Excel';
        msgDiv.style.display = 'block';
        return; 
    }
    
    let reader = new FileReader();
    reader.onload = async function(e){
        try {
            let wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            let sheet = wb.Sheets[wb.SheetNames[0]];
            let json = XLSX.utils.sheet_to_json(sheet);
            
            if(json.length === 0){
                msgDiv.innerHTML = '❌ File Excel không có dữ liệu';
                msgDiv.style.display = 'block';
                return;
            }
            
            let successCount = 0;
            let errorCount = 0;
            
            for(let item of json){
                let stt = getValueByKeys(item, ['STT', 'Stt', 'stt', 'Số thứ tự']);
                let hoTen = getValueByKeys(item, ['HỌ VÀ TÊN', 'HỌ TÊN', 'Họ và tên', 'Hoten', 'hoten']);
                let diaChi = getValueByKeys(item, ['ĐỊA CHỈ', 'Địa chỉ', 'Dia chi', 'diachi']);
                let thuocDien = getValueByKeys(item, ['THUỘC DIỆN', 'Thuộc diện', 'thuocdien']);
                let khuVuc = getValueByKeys(item, ['KHU VỰC', 'Khu vực', 'khuvuc']);
                let ghiChu = getValueByKeys(item, ['GHI CHÚ', 'Ghi chú', 'ghichu']);
                
                if(!hoTen || !diaChi){
                    errorCount++;
                    continue;
                }
                
                let recipientId = randomId();
                let qrUrl = baseUrl + '?id=' + recipientId;
                
                await set(ref(db, 'recipients/' + recipientId), {
                    id: recipientId,
                    stt: stt || successCount + 1,
                    hoTen: hoTen,
                    diaChi: diaChi,
                    thuocDien: thuocDien || '',
                    khuVuc: khuVuc || '',
                    ghiChu: ghiChu || '',
                    qrUrl: qrUrl,
                    totalReceived: 0,
                    createdAt: new Date().toISOString()
                });
                successCount++;
                await new Promise(r => setTimeout(r, 20));
            }
            
            successDiv.innerHTML = `✅ Import thành công: ${successCount} người${errorCount > 0 ? ` (bỏ qua ${errorCount} dòng thiếu thông tin)` : ''}`;
            successDiv.style.display = 'block';
            
            if(successCount > 0){
                await loadData();
            }
            
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
            
        } catch(err) {
            console.error('Lỗi import:', err);
            msgDiv.innerHTML = '❌ Lỗi khi đọc file: ' + err.message;
            msgDiv.style.display = 'block';
        }
    };
    reader.readAsArrayBuffer(file);
}

    if(!tbody) return;
    
    let today = getTodayStr();

    let receivedToday = {};
    if(receivedSnap.exists()){
        for(let fid in receivedSnap.val()){
            if(receivedSnap.val()[fid][today]) receivedToday[fid] = receivedSnap.val()[fid][today];
        }
    }
    
    allRecipients = [];
    let total = 0, receivedCount = 0;
    let areas = new Set();
    
    if(snap.exists()){
        let data = snap.val();
        for(let id in data){
            total++;
            let recipient = data[id];
            let isReceived = receivedToday[id];
            if(isReceived) receivedCount++;
            if(recipient.khuVuc) areas.add(recipient.khuVuc);
            
            allRecipients.push({
                id: id,
                stt: recipient.stt,
                hoTen: recipient.hoTen,
                diaChi: recipient.diaChi,
                thuocDien: recipient.thuocDien || '',
                khuVuc: recipient.khuVuc || '',
                ghiChu: recipient.ghiChu || '',
                received: isReceived ? true : false,
                receivedTime: isReceived ? isReceived.time : null,
                qrUrl: recipient.qrUrl
            });
        }
    }
    
    // Cập nhật dropdown khu vực
    let areaSelect = document.getElementById('filterArea');
    if(areaSelect){
        let currentValue = areaSelect.value;
        areaSelect.innerHTML = '<option value="all">🗺️ Tất cả khu vực</option>';
        Array.from(areas).sort().forEach(area => {
            if(area) areaSelect.innerHTML += `<option value="${escapeHtml(area)}">${escapeHtml(area)}</option>`;
        });
        if(currentValue && areaSelect.querySelector(`option[value="${currentValue}"]`)) {
            areaSelect.value = currentValue;
        }
    }
    
    document.getElementById('totalRecipients').innerText = total;
    document.getElementById('receivedToday').innerText = receivedCount;
    document.getElementById('notReceived').innerText = total - receivedCount;
    let percent = total > 0 ? Math.round(receivedCount / total * 100) : 0;
    document.getElementById('percentRate').innerText = percent;
    
    filterTable();
}

function filterTable(){
    let searchText = document.getElementById('searchInput').value.toLowerCase();
    let status = document.getElementById('filterStatus').value;
    let filterArea = document.getElementById('filterArea').value;
    let tbody = document.getElementById('tableData');
    
    let filtered = allRecipients.filter(r => {
        let matchSearch = (r.hoTen && r.hoTen.toLowerCase().includes(searchText)) || 
                          (r.diaChi && r.diaChi.toLowerCase().includes(searchText)) ||
                          (r.thuocDien && r.thuocDien.toLowerCase().includes(searchText)) ||
                          (r.khuVuc && r.khuVuc.toLowerCase().includes(searchText));
        let matchStatus = status === 'all' || (status === 'received' && r.received) || (status === 'notreceived' && !r.received);
        let matchArea = filterArea === 'all' || r.khuVuc === filterArea;
        return matchSearch && matchStatus && matchArea;
    });
    
    if(filtered.length === 0){
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;">📭 Không có dữ liệu. Vui lòng import danh sách từ Excel.</td></tr>';
        return;
    }
    
    tbody.innerHTML = '';
    filtered.forEach((r, idx) => {
        let statusHtml = r.received ? `<span class="badge-success">✅ Đã nhận<br>${r.receivedTime}</span>` : `<span class="badge-warning">⏳ Chưa nhận</span>`;
        tbody.innerHTML += `<tr>
            <td>${r.stt || idx+1}</td>
            <td style="text-align:left;">${escapeHtml(r.hoTen)}</td>
            <td style="text-align:left;">${escapeHtml(r.diaChi)}</td>
            <td>${escapeHtml(r.thuocDien) || '---'}</td>
            <td>${escapeHtml(r.khuVuc) || '---'}</td>
            <td>${escapeHtml(r.ghiChu) || '---'}</td>
            <td>${statusHtml}</td>
            <td>${r.receivedTime || '---'}</td>
            <td><button class="btn-view-qr" data-id="${r.id}" style="background:#2196f3;">🔲 Xem QR</button></td>
        </tr>`;
    });
    
    // Gắn sự kiện cho các nút xem QR
    document.querySelectorAll('.btn-view-qr').forEach(btn => {
        btn.onclick = () => showQRModal(btn.getAttribute('data-id'));
    });
}

function exportReportExcel(){
    if(allRecipients.length === 0){
        alert('Chưa có dữ liệu. Vui lòng import danh sách trước.');
        return;
    }
    
    let exportData = allRecipients.map((r, i) => ({
        'STT': r.stt || i+1,
        'HỌ VÀ TÊN': r.hoTen,
        'ĐỊA CHỈ': r.diaChi,
        'THUỘC DIỆN': r.thuocDien || '',
        'KHU VỰC': r.khuVuc || '',
        'GHI CHÚ': r.ghiChu || '',
        'TRẠNG THÁI': r.received ? 'ĐÃ NHẬN QUÀ' : 'CHƯA NHẬN',
        'THỜI GIAN NHẬN': r.receivedTime || '---'
    }));
    
    let ws = XLSX.utils.json_to_sheet(exportData);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'BaoCaoNhanQua');
    XLSX.writeFile(wb, `BAO_CAO_NHAN_QUA_${formatDate(new Date())}.xlsx`);
    alert(`✅ Đã xuất báo cáo ${allRecipients.length} người`);
}

let isVerifying = await checkVerification();
if(!isVerifying) await renderAdmin();
</script>
