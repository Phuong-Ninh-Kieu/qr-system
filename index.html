function randomToken(len=20){let s='';for(let i=0;i<len;i++)s+='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*62)];return s;}
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m;});}
function formatTime(d){return d.toLocaleTimeString('vi-VN');}
function formatDate(d){return d.toLocaleDateString('vi-VN');}
function getTodayStr(){return new Date().toISOString().split('T')[0];}
function getBaseUrl(){return window.location.href.split('?')[0];}
function removeVietnameseTones(str) {
    if(!str) return '';
    str = str.replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, 'a');
    str = str.replace(/[èéẹẻẽêềếệểễ]/g, 'e');
    str = str.replace(/[ìíịỉĩ]/g, 'i');
    str = str.replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, 'o');
    str = str.replace(/[ùúụủũưừứựửữ]/g, 'u');
    str = str.replace(/[ỳýỵỷỹ]/g, 'y');
    str = str.replace(/đ/g, 'd');
    str = str.replace(/[ÀÁẠẢÃÂẦẤẬẨẪĂẰẮẶẲẴ]/g, 'A');
    str = str.replace(/[ÈÉẸẺẼÊỀẾỆỂỄ]/g, 'E');
    str = str.replace(/[ÌÍỊỈĨ]/g, 'I');
    str = str.replace(/[ÒÓỌỎÕÔỒỐỘỔỖƠỜỚỢỞỠ]/g, 'O');
    str = str.replace(/[ÙÚỤỦŨƯỪỨỰỬỮ]/g, 'U');
    str = str.replace(/[ỲÝỴỶỸ]/g, 'Y');
    str = str.replace(/Đ/g, 'D');
    str = str.replace(/[^a-zA-Z0-9]/g, '_');
    return str;
}

// Kiểm tra xác thực từ QR
async function checkVerification(){
    let id = new URLSearchParams(location.search).get('id');
    let token = new URLSearchParams(location.search).get('token');
    if(!id && location.href.includes('?id=')){
        let m=location.href.match(/[?&]id=([^&]+)/);
        if(m)id=m[1];
        let tm=location.href.match(/[?&]token=([^&]+)/);
        if(tm)token=tm[1];
    }
    if(id&&token){
        document.getElementById('adminPanel').style.display='none';
        document.getElementById('verifyPanel').style.display='block';
        await doCheckin(id,token);
        return true;
    }
    return false;
}

async function doCheckin(id,token){
    let div=document.getElementById('verifyPanel');
    try{
        let snap=await get(child(ref(db),'users/'+id));
        if(!snap.exists()) throw new Error('Không tìm thấy');
        let data=snap.val();
        if(data.token!==token) throw new Error('Token sai');
        
        let today=getTodayStr();
        let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
        if(exist.exists()){
            let old=exist.val();
            div.innerHTML=`<div style="max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;"><div style="background:#ff9800;color:white;padding:20px;text-align:center;"><h2>⚠️ ĐÃ ĐIỂM DANH</h2></div><div style="padding:25px;text-align:center;"><div style="font-size:50px;">⏰</div><p><strong>${escapeHtml(data.fullname)}</strong></p><p>Giờ: ${old.time}</p><button onclick="location.href=location.pathname" style="width:100%;padding:12px;margin-top:15px;background:#ff9800;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
            return;
        }
        
        let now=new Date();
        await set(ref(db,'checkins/'+id+'/'+today),{
            userId:id,fullname:data.fullname,address:data.address,area:data.area,
            date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
        });
        let total=(data.totalCheckins||0)+1;
        await update(ref(db,'users/'+id),{totalCheckins:total});
        
        div.innerHTML=`<div style="max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;"><div style="background:#2e7d32;color:white;padding:20px;text-align:center;"><h2>✅ THÀNH CÔNG</h2></div><div style="padding:25px;text-align:center;"><div style="font-size:50px;">✅</div><p><strong>${escapeHtml(data.fullname)}</strong></p><p>⏰ ${formatTime(now)}</p><button onclick="location.href=location.pathname" style="width:100%;padding:12px;margin-top:15px;background:#2e7d32;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
        if(typeof loadData==='function') await loadData();
    }catch(e){
        div.innerHTML=`<div style="max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;"><div style="background:#b00000;color:white;padding:20px;text-align:center;"><h2>❌ KHÔNG HỢP LỆ</h2></div><div style="padding:25px;text-align:center;"><button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#b00000;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
    }
}

function selectAll(checked){
    let checkboxes = document.querySelectorAll('.user-checkbox');
    checkboxes.forEach(cb => cb.checked = checked);
}

async function exportMultiplePDF(){
    let checkboxes = document.querySelectorAll('.user-checkbox:checked');
    if(checkboxes.length === 0){
        alert('Vui lòng chọn ít nhất 1 người để xuất PDF');
        return;
    }
    
    let selectedUsers = [];
    checkboxes.forEach(cb => {
        let id = cb.getAttribute('data-id');
        let user = allUsersData.find(u => u.userId === id);
        if(user) selectedUsers.push(user);
    });
    
    alert(`Đang xuất PDF cho ${selectedUsers.length} người... Vui lòng chờ`);
    
    let zip = new JSZip();
    let count = 0;
    
    for(let user of selectedUsers){
        count++;
        let pdfBlob = await generateSinglePDF(user);
        let fileName = removeVietnameseTones(user.fullname) + '_' + user.userId + '.pdf';
        zip.file(fileName, pdfBlob);
        
        // Cập nhật tiến trình
        document.getElementById('scanResult').innerHTML = `⏳ Đang xuất: ${count}/${selectedUsers.length}`;
    }
    
    let content = await zip.generateAsync({type:"blob"});
    let link = document.createElement('a');
    let url = URL.createObjectURL(content);
    link.href = url;
    link.download = `DANH_SACH_THE_QR_${formatDate(new Date())}.zip`;
    link.click();
    URL.revokeObjectURL(url);
    
    document.getElementById('scanResult').innerHTML = `✅ Đã xuất ${selectedUsers.length} thẻ QR thành công!`;
    alert(`✅ Đã xuất ${selectedUsers.length} thẻ QR vào file ZIP`);
}

async function generateSinglePDF(user){
    return new Promise(async (resolve) => {
        // Tạo thẻ tạm thời
        let tempDiv = document.createElement('div');
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        tempDiv.style.top = '-9999px';
        tempDiv.innerHTML = `
            <div style="width:300px;border:2px solid #b00000;padding:20px;border-radius:16px;background:#fff;text-align:center;">
                <h3 style="color:#b00000;margin-bottom:15px;">🎫 THẺ ĐIỂM DANH</h3>
                <div id="temp_qrcode_${user.userId}"></div>
                <p style="margin-top:15px;"><strong>${escapeHtml(user.fullname)}</strong></p>
                <p style="font-size:12px;color:#666;">Mã: ${user.userId}</p>
                <p style="font-size:11px;margin-top:10px;">Quét QR để điểm danh</p>
            </div>
        `;
        document.body.appendChild(tempDiv);
        
        let url = getBaseUrl() + '?id=' + user.userId + '&token=' + user.token;
        new QRCode(document.getElementById(`temp_qrcode_${user.userId}`), { text: url, width: 200, height: 200 });
        
        setTimeout(async () => {
            let canvas = await html2canvas(tempDiv.querySelector('div'));
            let imgData = canvas.toDataURL('image/png');
            let { jsPDF } = window.jspdf;
            let pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
            let imgWidth = 90;
            let imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 60, 50, imgWidth, imgHeight);
            let pdfBlob = pdf.output('blob');
            document.body.removeChild(tempDiv);
            resolve(pdfBlob);
        }, 500);
    });
}

async function initCameraList(){
    try{
        let devices = await Html5Qrcode.getCameras();
        let select = document.getElementById('cameraSelect');
        if(!select) return;
        
        select.innerHTML = '<option value="">-- Chọn camera --</option>';
        devices.forEach((device, index) => {
            let label = device.label || `Camera ${index + 1}`;
            let isBack = label.toLowerCase().includes('back') || label.toLowerCase().includes('environment') || label.toLowerCase().includes('rear');
            let isFront = label.toLowerCase().includes('front') || label.toLowerCase().includes('user');
            let type = isBack ? '📷 (Sau)' : (isFront ? '🤳 (Trước)' : '📹');
            select.innerHTML += `<option value="${device.id}">${type} ${label.substring(0,40)}</option>`;
        });
        
        let backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
        if(backCamera){
            select.value = backCamera.id;
            currentCameraId = backCamera.id;
        } else if(devices.length > 0){
            select.value = devices[0].id;
            currentCameraId = devices[0].id;
        }
        
        if(currentCameraId) await startCamera(currentCameraId);
    } catch(err){
        document.getElementById('scanResult').innerHTML = '⚠️ Vui lòng cho phép truy cập camera';
    }
}

async function startCamera(cameraId){
    if(html5QrCode){
        try{ await html5QrCode.stop(); } catch(e){}
        try{ html5QrCode.clear(); } catch(e){}
    }
    
    html5QrCode = new Html5Qrcode("qr-reader");
    try{
        await html5QrCode.start(cameraId, {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        }, onScanSuccess, onScanError);
        
        let cameraName = document.getElementById('cameraSelect').options[document.getElementById('cameraSelect').selectedIndex]?.text || 'Camera';
        document.getElementById('scanResult').innerHTML = `✅ ${cameraName} đã sẵn sàng! Đưa QR vào khung.`;
    } catch(err){
        document.getElementById('scanResult').innerHTML = `⚠️ Không thể mở camera. Vui lòng kiểm tra quyền truy cập.`;
    }
}

async function switchCamera(){
    let select = document.getElementById('cameraSelect');
    let newCameraId = select.value;
    if(!newCameraId){
        alert('Vui lòng chọn camera');
        return;
    }
    currentCameraId = newCameraId;
    await startCamera(currentCameraId);
}

function onScanSuccess(decodedText){
    if(isScanning) return;
    isScanning = true;
    
    try{
        let url = new URL(decodedText);
        let id = url.searchParams.get('id');
        let token = url.searchParams.get('token');
        if(id && token){
            processScan(id, token);
        } else {
            document.getElementById('scanResult').innerHTML = '✗ QR không đúng định dạng';
        }
    } catch(e){
        document.getElementById('scanResult').innerHTML = '✗ QR không hợp lệ';
    }
    
    setTimeout(() => { isScanning = false; }, 2000);
}

function onScanError(error){}

async function processScan(id, token){
    let snap = await get(child(ref(db), 'users/' + id));
    let resDiv = document.getElementById('scanResult');
    
    if(!snap.exists()){
        resDiv.innerHTML = '❌ Không tìm thấy người dùng';
        return;
    }
    
    let data = snap.val();
    if(data.token !== token){
        resDiv.innerHTML = '❌ QR không hợp lệ';
        return;
    }
    
    let today = getTodayStr();
    let exist = await get(child(ref(db), 'checkins/' + id + '/' + today));
    if(exist.exists()){
        resDiv.innerHTML = `⚠️ ${data.fullname} đã điểm danh lúc ${exist.val().time}`;
        return;
    }
    
    let now = new Date();
    await set(ref(db, 'checkins/' + id + '/' + today), {
        userId: id, fullname: data.fullname, address: data.address, area: data.area,
        date: today, time: formatTime(now), datetime: now.toISOString(), status: 'present'
    });
    let total = (data.totalCheckins || 0) + 1;
    await update(ref(db, 'users/' + id), { totalCheckins: total });
    
    resDiv.innerHTML = `✅ THÀNH CÔNG! ${data.fullname} - ${formatTime(now)}`;
    await loadData();
}

async function loadData(){
    let snap = await get(child(ref(db), 'users'));
    let tbody = document.getElementById('tableData');
    if(!tbody) return;
    tbody.innerHTML = '';
    let today = getTodayStr();
    let checkSnap = await get(child(ref(db), 'checkins'));
    let checked = {};
    if(checkSnap.exists()){
        for(let uid in checkSnap.val()){
            if(checkSnap.val()[uid][today]) checked[uid] = checkSnap.val()[uid][today];
        }
    }
    
    allUsersData = [];
    let total = 0, checkedCount = 0;
    if(snap.exists()){
        let data = snap.val();
        for(let id in data){
            total++;
            let isChecked = checked[id];
            if(isChecked) checkedCount++;
            let status = isChecked ? `<span class="badge badge-success">✅ ${isChecked.time}</span>` : `<span class="badge badge-warning">⏳ Chưa</span>`;
            allUsersData.push({
                stt: data[id].stt, fullname: data[id].fullname, address: data[id].address,
                area: data[id].area, status: isChecked ? 'Đã điểm danh' : 'Chưa điểm danh',
                checkinTime: isChecked ? isChecked.time : '---', userId: id, token: data[id].token
            });
            tbody.innerHTML += `<tr>
                <td><input type="checkbox" class="user-checkbox" data-id="${id}"></td>
                <td>${data[id].stt}</td>
                <td style="text-align:left;">${escapeHtml(data[id].fullname)}</td>
                <td>${escapeHtml(data[id].area)}</td>
                <td>${status}</td>
                <td class="action-buttons">
                    ${!isChecked ? `<button class="btn-manual" onclick="manualCheckin('${id}')">📝 Thủ công</button>` : ''}
                    <button onclick="showQR('${id}','${data[id].token}')">🔲 QR</button>
                </td>
            </tr>`;
        }
    }
    document.getElementById('totalUsers').innerText = total;
    document.getElementById('totalCheckins').innerText = checkedCount;
    document.getElementById('notCheckin').innerText = total - checkedCount;
    let rate = total > 0 ? Math.round(checkedCount / total * 100) : 0;
    document.getElementById('checkinRate').innerText = rate;
    
    // Gắn sự kiện cho header checkbox
    let headerCb = document.getElementById('headerCheckbox');
    if(headerCb){
        headerCb.onchange = (e) => selectAll(e.target.checked);
    }
}

window.manualCheckin = async function(id){
    if(!confirm('Xác nhận điểm danh thủ công?')) return;
    let snap = await get(child(ref(db), 'users/' + id));
    if(!snap.exists()){ alert('Không tìm thấy'); return; }
    let data = snap.val();
    let today = getTodayStr();
    let exist = await get(child(ref(db), 'checkins/' + id + '/' + today));
    if(exist.exists()){ alert(`${data.fullname} đã điểm danh rồi!`); return; }
    let now = new Date();
    await set(ref(db, 'checkins/' + id + '/' + today), {
        userId: id, fullname: data.fullname, address: data.address, area: data.area,
        date: today, time: formatTime(now), datetime: now.toISOString(), status: 'present'
    });
    let total = (data.totalCheckins || 0) + 1;
    await update(ref(db, 'users/' + id), { totalCheckins: total });
    alert(`✅ Điểm danh thành công: ${data.fullname}`);
    await loadData();
};

async function importExcel(baseUrl){
    let file = document.getElementById('excelFile').files[0];
    if(!file){ alert('Chọn file Excel'); return; }
    let reader = new FileReader();
    reader.onload = async function(e){
        let wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        let sheet = wb.Sheets[wb.SheetNames[0]];
        let json = XLSX.utils.sheet_to_json(sheet);
        for(let item of json){
            let v = Object.values(item);
            let id = 'QR' + Date.now() + Math.floor(Math.random() * 1000);
            let token = randomToken();
            await set(ref(db, 'users/' + id), {
                stt: v[0] || '', fullname: v[1] || '', address: v[2] || '', area: v[3] || '',
                token: token, scan: 0, totalCheckins: 0, createdAt: new Date().toISOString()
            });
            await new Promise(r => setTimeout(r, 30));
        }
        alert('✅ Import thành công!');
        await loadData();
    };
    reader.readAsArrayBuffer(file);
}

function exportExcel(type){
    let data = [];
    let filename = `DANH_SACH_${formatDate(new Date())}.xlsx`;
    if(type === 'checked') data = allUsersData.filter(u => u.status === 'Đã điểm danh');
    else if(type === 'unchecked') data = allUsersData.filter(u => u.status === 'Chưa điểm danh');
    else data = allUsersData;
    if(data.length === 0){ alert('Không có dữ liệu!'); return; }
    let exportData = data.map((item, i) => ({
        'STT': i + 1, 'HỌ TÊN': item.fullname, 'ĐỊA CHỈ': item.address,
        'KHU VỰC': item.area, 'TRẠNG THÁI': item.status, 'GIỜ CHECK-IN': item.checkinTime
    }));
    let ws = XLSX.utils.json_to_sheet(exportData);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'DanhSach');
    XLSX.writeFile(wb, filename);
    alert(`✅ Xuất ${data.length} người`);
}

window.showQR = function(id, token){
    let url = getBaseUrl() + '?id=' + id + '&token=' + token;
    document.getElementById('cardArea').innerHTML = `<div class="card-preview" id="pdfCard"><h3>🎫 THẺ ĐIỂM DANH</h3><div id="qrcode"></div><p>${id}</p></div>`;
    new QRCode(document.getElementById('qrcode'), { text: url, width: 200, height: 200 });
    setTimeout(() => {
        let btn = document.createElement('button');
        btn.innerHTML = '📄 Xuất PDF thẻ này';
        btn.onclick = () => exportSinglePDF(id, token);
        btn.style.marginTop = '10px';
        btn.style.padding = '8px';
        document.getElementById('pdfCard').appendChild(btn);
    }, 100);
};

window.exportSinglePDF = async function(id, token){
    let user = allUsersData.find(u => u.userId === id);
    if(!user){ alert('Không tìm thấy thông tin'); return; }
    let pdfBlob = await generateSinglePDF(user);
    let link = document.createElement('a');
    let url = URL.createObjectURL(pdfBlob);
    link.href = url;
    link.download = removeVietnameseTones(user.fullname) + '_' + id + '.pdf';
    link.click();
    URL.revokeObjectURL(url);
};

let isVerifying = await checkVerification();
if(!isVerifying) await renderAdmin();
