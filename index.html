<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>ĐIỂM DANH QR - UBND</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}
body{background:#eef2f7;padding-bottom:30px;}
.header{background:#b00000;color:#fff;padding:16px;text-align:center;border-bottom:4px solid #ffcc00;}
.header h1{font-size:22px;margin-bottom:5px;}
.container{width:95%;max-width:700px;margin:15px auto;}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.card h2{color:#b00000;font-size:18px;margin-bottom:15px;border-left:4px solid #b00000;padding-left:12px;}
.dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.box{background:#b00000;color:#fff;padding:15px;border-radius:12px;text-align:center;}
.box h3{font-size:28px;margin-bottom:5px;}
.box p{font-size:12px;}
button{background:#b00000;color:#fff;padding:10px 16px;border:none;border-radius:10px;font-size:13px;font-weight:bold;margin:5px;cursor:pointer;}
button:hover{opacity:0.9;}
.btn-green{background:#2e7d32;}
.btn-orange{background:#ff9800;}
.btn-blue{background:#2196f3;}
.btn-manual{background:#9c27b0;}
input{padding:12px;border:1px solid #ccc;border-radius:10px;margin:5px;}
.table-container{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#b00000;color:#fff;padding:10px;}
td{border:1px solid #ddd;padding:8px;text-align:center;}
.valid{background:#e8f5e9;color:#2e7d32;padding:15px;border-radius:12px;}
.invalid{background:#ffebee;color:#c62828;padding:15px;border-radius:12px;}
#reader{width:100%;max-width:100%;margin:auto;}
.card-preview{width:300px;margin:auto;border:2px solid #b00000;padding:20px;border-radius:16px;background:#fff;}
.footer{text-align:center;padding:15px;color:#666;font-size:12px;}
.verify-card{max-width:450px;margin:20px auto;background:white;border-radius:20px;overflow:hidden;}
.verify-header{background:#b00000;color:white;padding:20px;text-align:center;}
.verify-content{padding:25px;}
.result-status{font-size:24px;font-weight:bold;padding:12px;border-radius:12px;text-align:center;margin:15px 0;}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;}
.badge-success{background:#e8f5e9;color:#2e7d32;}
.badge-warning{background:#ffebee;color:#c62828;}
.export-buttons{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
.export-buttons button{flex:1;min-width:100px;}
.action-buttons{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.action-buttons button{font-size:11px;padding:6px 10px;margin:2px;}
</style>
</head>
<body>

<div class="header">
    <h1>🏛️ ĐIỂM DANH BẰNG QR</h1>
    <p>ỦY BAN NHÂN DÂN</p>
</div>

<div id="adminPanel" class="container"></div>
<div id="verifyPanel" style="display:none;"></div>
<div class="footer">HỆ THỐNG ĐIỂM DANH QR</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { 
    apiKey: "AIzaSyCnrj2LgPIhmHQ-2gFsj2WzEa1n0RzWrbw",
    authDomain: "van-ban-65d6c.firebaseapp.com",
    databaseURL: "https://van-ban-65d6c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "van-ban-65d6c",
    storageBucket: "van-ban-65d6c.firebasestorage.app",
    messagingSenderId: "841852290034",
    appId: "1:841852290034:web:21b9c176c86420b9f6216b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let html5QrCode = null;
let allUsersData = [];
let checkedTodayData = {};

function randomToken(len=32){let s='';for(let i=0;i<len;i++)s+='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*62)];return s;}
function escapeHtml(str){if(!str)return'';return str.replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m;});}
function formatTime(d){return d.toLocaleTimeString('vi-VN');}
function formatDate(d){return d.toLocaleDateString('vi-VN');}
function getTodayStr(){return new Date().toISOString().split('T')[0];}
function getBaseUrl(){return window.location.href.split('?')[0];}

// Xác thực khi quét QR từ người dân
async function checkVerification(){
    let id = new URLSearchParams(location.search).get('id');
    let token = new URLSearchParams(location.search).get('token');
    if(!id && location.href.includes('?id=')){
        let m=location.href.match(/[?&]id=([^&]+)/);
        if(m)id=m[1];
        let tm=location.href.match(/[?&]token=([^&]+)/);
        if(tm)token=tm[1];
    }
    if(id&&token){
        document.getElementById('adminPanel').style.display='none';
        document.getElementById('verifyPanel').style.display='block';
        await doCheckin(id,token);
        return true;
    }
    return false;
}

async function doCheckin(id,token){
    let div=document.getElementById('verifyPanel');
    try{
        let snap=await get(child(ref(db),'users/'+id));
        if(!snap.exists()){
            div.innerHTML=`<div class="verify-card"><div class="verify-header"><h2>🔍 KẾT QUẢ</h2></div><div class="verify-content"><div style="font-size:50px;text-align:center;">❌</div><div class="result-status" style="background:#ffebee;color:#c62828;">KHÔNG HỢP LỆ</div><p>Mã QR không tồn tại</p><button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#b00000;color:white;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
            return;
        }
        let data=snap.val();
        if(data.token!==token){
            div.innerHTML=`<div class="verify-card"><div class="verify-header"><h2>🔍 KẾT QUẢ</h2></div><div class="verify-content"><div style="font-size:50px;text-align:center;">⚠️</div><div class="result-status" style="background:#ffebee;color:#c62828;">KHÔNG HỢP LỆ</div><p>Token không đúng</p><button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#b00000;color:white;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
            return;
        }
        let today=getTodayStr();
        let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
        if(exist.exists()){
            let old=exist.val();
            div.innerHTML=`<div class="verify-card"><div class="verify-header" style="background:#ff9800;"><h2>⚠️ ĐÃ ĐIỂM DANH</h2></div><div class="verify-content"><div style="font-size:50px;text-align:center;">⏰</div><div class="result-status" style="background:#fff3e0;color:#e65100;">ĐÃ CHECK-IN</div><div style="background:#f5f5f5;border-radius:12px;padding:15px;"><p><strong>${escapeHtml(data.fullname)}</strong></p><p>Giờ: ${old.time}</p></div><button onclick="location.href=location.pathname" style="width:100%;padding:12px;margin-top:15px;background:#ff9800;border:none;border-radius:10px;">ĐÓNG</button></div></div>`;
            return;
        }
        let now=new Date();
        await set(ref(db,'checkins/'+id+'/'+today),{
            userId:id,fullname:data.fullname,address:data.address,area:data.area,
            date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
        });
        let total=(data.totalCheckins||0)+1;
        await update(ref(db,'users/'+id),{totalCheckins:total,lastCheckin:now.toISOString()});
        div.innerHTML=`<div class="verify-card"><div class="verify-header" style="background:#2e7d32;"><h2>✅ ĐIỂM DANH THÀNH CÔNG</h2></div><div class="verify-content"><div style="font-size:50px;text-align:center;">✅</div><div class="result-status" style="background:#e8f5e9;color:#2e7d32;">THÀNH CÔNG</div><div style="background:#f5f5f5;border-radius:12px;padding:15px;"><p><strong>${escapeHtml(data.fullname)}</strong></p><p>⏰ ${formatTime(now)}</p><p>📍 ${escapeHtml(data.address)}</p></div><button onclick="location.href=location.pathname" style="width:100%;padding:12px;margin-top:15px;background:#2e7d32;border:none;border-radius:10px;">XÁC NHẬN</button></div></div>`;
        if(typeof loadData==='function')await loadData();
        if(typeof loadStats==='function')await loadStats();
    }catch(e){console.log(e);}
}

// ADMIN
async function renderAdmin(){
    let baseUrl=getBaseUrl();
    document.getElementById('adminPanel').innerHTML=`
        <div class="card"><h2>📊 THỐNG KÊ</h2><div class="dashboard">
            <div class="box"><h3 id="totalUsers">0</h3><p>TỔNG</p></div>
            <div class="box"><h3 id="totalCheckins">0</h3><p>ĐÃ ĐIỂM DANH</p></div>
            <div class="box"><h3 id="notCheckin">0</h3><p>CHƯA</p></div>
            <div class="box"><h3 id="checkinRate">0</h3><p>TỶ LỆ</p></div>
        </div></div>
        <div class="card"><h2>📂 IMPORT EXCEL</h2>
            <input type="file" id="excelFile" accept=".xlsx,.xls">
            <button id="importBtn">📤 IMPORT</button>
        </div>
        <div class="card"><h2>📷 QUÉT QR (Camera sau)</h2>
            <div id="reader"></div>
            <div id="scanResult" style="margin-top:12px;"></div>
        </div>
        <div class="card"><h2>📋 DANH SÁCH ĐIỂM DANH HÔM NAY</h2>
            <div class="export-buttons">
                <button id="exportCheckedBtn" class="btn-green">📥 Đã điểm danh</button>
                <button id="exportUncheckedBtn" class="btn-orange">📥 Chưa điểm danh</button>
                <button id="exportAllBtn" class="btn-blue">📥 Tất cả</button>
            </div>
            <div class="table-container" style="margin-top:15px;">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th><th>HỌ TÊN</th><th>ĐỊA CHỈ</th><th>KHU VỰC</th><th>TRẠNG THÁI</th><th>GIỜ</th><th>THAO TÁC</th>
                        </tr>
                    </thead>
                    <tbody id="tableData"></tbody>
                </table>
            </div>
        </div>
        <div class="card"><h2>🖨️ XUẤT THẺ QR</h2><div id="cardArea"></div></div>
    `;
    document.getElementById('importBtn').onclick=()=>importExcel(baseUrl);
    document.getElementById('exportCheckedBtn').onclick=()=>exportExcel('checked');
    document.getElementById('exportUncheckedBtn').onclick=()=>exportExcel('unchecked');
    document.getElementById('exportAllBtn').onclick=()=>exportExcel('all');
    await loadData();
    await loadStats();
    startBackCamera();
}

async function loadStats(){
    let today=getTodayStr();
    let snap=await get(child(ref(db),'checkins'));
    let checked=0;
    if(snap.exists()){
        for(let uid in snap.val()){
            if(snap.val()[uid][today])checked++;
        }
    }
    let total=parseInt(document.getElementById('totalUsers')?.innerText||0);
    document.getElementById('totalCheckins').innerText=checked;
    document.getElementById('notCheckin').innerText=total-checked;
    let rate=total>0?Math.round(checked/total*100):0;
    document.getElementById('checkinRate').innerText=rate;
}

async function importExcel(baseUrl){
    let file=document.getElementById('excelFile').files[0];
    if(!file){alert('Chọn file Excel');return;}
    let reader=new FileReader();
    reader.onload=async function(e){
        let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        let sheet=wb.Sheets[wb.SheetNames[0]];
        let json=XLSX.utils.sheet_to_json(sheet);
        for(let item of json){
            let v=Object.values(item);
            let id='QR'+Date.now()+Math.floor(Math.random()*1000);
            let token=randomToken();
            let url=baseUrl+'?id='+id+'&token='+token;
            await set(ref(db,'users/'+id),{
                stt:v[0]||'',fullname:v[1]||'',address:v[2]||'',area:v[3]||'',
                token:token,qr:url,scan:0,totalCheckins:0,createdAt:new Date().toISOString()
            });
        }
        alert('✅ Import thành công!');
        await loadData();
    };
    reader.readAsArrayBuffer(file);
}

async function loadData(){
    let snap=await get(child(ref(db),'users'));
    let tbody=document.getElementById('tableData');
    if(!tbody)return;
    tbody.innerHTML='';
    let today=getTodayStr();
    let checkSnap=await get(child(ref(db),'checkins'));
    let checked={};
    if(checkSnap.exists()){
        for(let uid in checkSnap.val()){
            if(checkSnap.val()[uid][today])checked[uid]=checkSnap.val()[uid][today];
        }
    }
    checkedTodayData = checked;
    allUsersData = [];
    
    if(snap.exists()){
        let data=snap.val();
        let total=0;
        for(let id in data){
            total++;
            let isChecked=checked[id];
            let status=isChecked?`<span class="badge badge-success">✅ Đã điểm danh</span>`:`<span class="badge badge-warning">⏳ Chưa điểm danh</span>`;
            let checkinTime=isChecked?isChecked.time:'---';
            allUsersData.push({
                stt: data[id].stt,
                fullname: data[id].fullname,
                address: data[id].address,
                area: data[id].area,
                status: isChecked?'Đã điểm danh':'Chưa điểm danh',
                checkinTime: checkinTime,
                userId: id,
                token: data[id].token
            });
            tbody.innerHTML+=`<tr>
                <td>${data[id].stt}</td>
                <td>${escapeHtml(data[id].fullname)}</td>
                <td>${escapeHtml(data[id].address)}</td>
                <td>${escapeHtml(data[id].area)}</td>
                <td>${status}</td>
                <td>${checkinTime}</td>
                <td class="action-buttons">
                    ${!isChecked ? `<button class="btn-manual" onclick="manualCheckin('${id}')">📝 Điểm danh thủ công</button>` : ''}
                    <button onclick="window.showQR('${id}','${data[id].token}')">🔲 QR</button>
                    <button onclick="window.exportPDF('${id}')">📄 PDF</button>
                </td>
            </tr>`;
        }
        document.getElementById('totalUsers').innerText=total;
        await loadStats();
    }
}

// ĐIỂM DANH THỦ CÔNG
window.manualCheckin = async function(id){
    if(!confirm('Xác nhận điểm danh thủ công cho người này?')) return;
    
    let snap=await get(child(ref(db),'users/'+id));
    if(!snap.exists()){
        alert('Không tìm thấy người dùng!');
        return;
    }
    
    let data=snap.val();
    let today=getTodayStr();
    let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
    
    if(exist.exists()){
        alert(`⚠️ ${data.fullname} đã điểm danh lúc ${exist.val().time} rồi!`);
        return;
    }
    
    let now=new Date();
    await set(ref(db,'checkins/'+id+'/'+today),{
        userId:id,fullname:data.fullname,address:data.address,area:data.area,
        date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
    });
    let total=(data.totalCheckins||0)+1;
    await update(ref(db,'users/'+id),{totalCheckins:total,lastCheckin:now.toISOString()});
    
    alert(`✅ Điểm danh thành công cho ${data.fullname} lúc ${formatTime(now)}`);
    await loadData();
    await loadStats();
}

// XUẤT EXCEL
function exportExcel(type){
    let dataToExport = [];
    let filename = '';
    let today = formatDate(new Date());
    
    if(type === 'checked'){
        dataToExport = allUsersData.filter(u => u.status === 'Đã điểm danh');
        filename = `DANH_SACH_DA_DIEM_DANH_${today}.xlsx`;
        if(dataToExport.length === 0){
            alert('Chưa có ai điểm danh hôm nay!');
            return;
        }
    } else if(type === 'unchecked'){
        dataToExport = allUsersData.filter(u => u.status === 'Chưa điểm danh');
        filename = `DANH_SACH_CHUA_DIEM_DANH_${today}.xlsx`;
        if(dataToExport.length === 0){
            alert('Tất cả đã điểm danh hôm nay!');
            return;
        }
    } else {
        dataToExport = allUsersData;
        filename = `DANH_SACH_TAT_CA_${today}.xlsx`;
    }
    
    const exportData = dataToExport.map((item, index) => ({
        'STT': index + 1,
        'HỌ TÊN': item.fullname,
        'ĐỊA CHỈ': item.address,
        'KHU VỰC': item.area,
        'TRẠNG THÁI': item.status,
        'GIỜ CHECK-IN': item.checkinTime,
        'MÃ SỐ': item.userId
    }));
    
    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'DanhSach');
    XLSX.writeFile(wb, filename);
    alert(`✅ Đã xuất ${dataToExport.length} người vào file ${filename}`);
}

window.showQR=function(id,token){
    let url=getBaseUrl()+'?id='+id+'&token='+token;
    document.getElementById('cardArea').innerHTML=`<div class="card-preview" id="pdfCard"><h3>🎫 THẺ ĐIỂM DANH</h3><div id="qrcode"></div><p>Mã: ${id}</p><p style="font-size:11px;">Quét QR để điểm danh</p></div>`;
    new QRCode(document.getElementById('qrcode'),{text:url,width:220,height:220});
}
window.exportPDF=async function(id){
    let card=document.getElementById('pdfCard');
    if(!card){alert('Xem QR trước');return;}
    let canvas=await html2canvas(card);
    let {jsPDF}=window.jspdf;
    let pdf=new jsPDF();
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',10,10,90,120);
    pdf.save(id+'.pdf');
}

// TỰ ĐỘNG CHỌN CAMERA SAU
async function startBackCamera(){
    let readerDiv=document.getElementById('reader');
    if(!readerDiv)return;
    if(html5QrCode){
        try{await html5QrCode.stop();}catch(e){}
    }
    html5QrCode=new Html5Qrcode("reader");
    try{
        let devices=await Html5Qrcode.getCameras();
        if(devices.length===0){
            document.getElementById('scanResult').innerHTML='<div class="invalid">❌ Không tìm thấy camera</div>';
            return;
        }
        let backCamera=devices.find(d=>d.label.toLowerCase().includes('back')||d.label.toLowerCase().includes('environment')||d.label.toLowerCase().includes('rear'));
        let cameraToUse=backCamera?backCamera.id:devices[0].id;
        await html5QrCode.start(cameraToUse,{fps:10,qrbox:250},onScanSuccess);
        document.getElementById('scanResult').innerHTML='<div class="valid">✅ Camera sau đang hoạt động. Đưa QR vào khung để điểm danh.</div>';
    }catch(err){
        document.getElementById('scanResult').innerHTML='<div class="invalid">⚠️ Vui lòng cho phép truy cập camera</div>';
    }
}

function onScanSuccess(text){
    try{
        let url=new URL(text);
        let id=url.searchParams.get('id');
        let token=url.searchParams.get('token');
        if(id&&token)verifyAndCheckin(id,token);
        else document.getElementById('scanResult').innerHTML='<div class="invalid">✗ QR sai định dạng</div>';
    }catch(e){
        document.getElementById('scanResult').innerHTML='<div class="invalid">✗ QR không hợp lệ</div>';
    }
}

async function verifyAndCheckin(id,token){
    let snap=await get(child(ref(db),'users/'+id));
    let resDiv=document.getElementById('scanResult');
    if(!snap.exists()){
        resDiv.innerHTML='<div class="invalid">❌ Không tìm thấy</div>';
        return;
    }
    let data=snap.val();
    if(data.token!==token){
        resDiv.innerHTML='<div class="invalid">❌ QR không hợp lệ</div>';
        return;
    }
    let today=getTodayStr();
    let exist=await get(child(ref(db),'checkins/'+id+'/'+today));
    if(exist.exists()){
        resDiv.innerHTML=`<div class="invalid">⚠️ ${data.fullname} đã điểm danh lúc ${exist.val().time}</div>`;
        return;
    }
    let now=new Date();
    await set(ref(db,'checkins/'+id+'/'+today),{
        userId:id,fullname:data.fullname,address:data.address,area:data.area,
        date:today,time:formatTime(now),datetime:now.toISOString(),status:'present'
    });
    let total=(data.totalCheckins||0)+1;
    await update(ref(db,'users/'+id),{totalCheckins:total});
    resDiv.innerHTML=`<div class="valid">✅ ĐIỂM DANH THÀNH CÔNG!<br>👤 ${data.fullname}<br>⏰ ${formatTime(now)}</div>`;
    await loadData();
    await loadStats();
}

let isVerifying=await checkVerification();
if(!isVerifying) await renderAdmin();
</script>
</body>
</html>
